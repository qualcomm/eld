name: CI
run-name: "CI PR #${{ github.event.pull_request.number }} @${{ github.event.pull_request.head.sha }}"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Keep CI changes covered while avoiding CI runs for changes to the other
    # workflow definitions.
    paths:
      - '**'
      - '!**/configure_external_llvm.sh'
      - '!.github/pr-labeler.yml'
      - '!.github/workflows/**'
      - '!etc/**/*.sh'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ubuntu.yml'

jobs:
  changes:
    name: Check for non-documentation changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      skip_build: ${{ steps.file-check.outputs.skip_build }}
    steps:
      - name: Check for non-doc changes
        id: file-check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              }
            );
            const onlyDocs = files.length > 0 && files.every(({ filename }) =>
              filename.startsWith('docs/') || filename.endsWith('.md')
            );
            core.info(`Changed files: ${files.map(({ filename }) => filename).join(', ')}`);
            core.setOutput('skip_build', String(onlyDocs));

  build:
    name: Ubuntu CI
    needs: changes
    if: needs.changes.outputs.skip_build == 'false'
    uses: ./.github/workflows/ubuntu.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      pr_sha: ${{ github.event.pull_request.head.sha }}
      request_id: automatic
      check_name: ci
      skip_tests: false
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
