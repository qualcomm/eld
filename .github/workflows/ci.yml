name: CI
run-name: "CI PR #${{ github.event.pull_request.number }} @${{ github.event.pull_request.head.sha }}"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Run the lightweight workflow lint job for workflow-only changes without
    # running the Ubuntu build.
    paths:
      - '**'
      - '!**/configure_external_llvm.sh'
      - '!.github/pr-labeler.yml'
      - '!.github/workflows/**'
      - '!etc/**/*.sh'
      - '.github/workflows/**'

jobs:
  changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      skip_build: ${{ steps.file-check.outputs.skip_build }}
      workflow_changed: ${{ steps.file-check.outputs.workflow_changed }}
      workflow_files: ${{ steps.file-check.outputs.workflow_files }}
      skip_workflow_lint_check: ${{ steps.file-check.outputs.skip_workflow_lint_check }}
    steps:
      - name: Classify changed files
        id: file-check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              }
            );
            const pullRequest = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const skipWorkflowLintCheck = pullRequest.data.labels.some(
              ({ name }) => name === 'skip-workflow-lint-check'
            );
            const onlyDocs = files.length > 0 && files.every(({ filename }) =>
              filename.startsWith('docs/') || filename.endsWith('.md')
            );
            // Lint only top-level workflow definitions, not nested composite
            // action metadata or helper scripts.
            const workflowFiles = files
              .filter(({ filename, status }) => {
                const relativePath = filename.slice('.github/workflows/'.length);
                return filename.startsWith('.github/workflows/') &&
                  !relativePath.includes('/') &&
                  /\.(yml|yaml)$/i.test(filename) &&
                  status !== 'removed';
              })
              .map(({ filename }) => filename);
            const onlyWorkflows = files.length > 0 && files.every(({ filename }) =>
              filename.startsWith('.github/workflows/')
            );
            const skipBuild = onlyDocs || onlyWorkflows;
            core.info(`Changed files: ${files.map(({ filename }) => filename).join(', ')}`);
            core.setOutput('skip_build', String(skipBuild));
            core.setOutput('workflow_changed', String(workflowFiles.length > 0));
            core.setOutput('workflow_files', JSON.stringify(workflowFiles));
            core.setOutput('skip_workflow_lint_check', String(skipWorkflowLintCheck));
            core.info(`Skip workflow lint check label present: ${skipWorkflowLintCheck}`);
            // Explain on the run summary page why the Ubuntu CI build was
            // skipped, since GitHub only shows the job as "skipped".
            if (skipBuild) {
              const reason = onlyDocs
                ? 'This pull request only changes documentation (files under <code>docs/</code> or ending in <code>.md</code>).'
                : 'This pull request only changes files under <code>.github/workflows/</code>.';
              await core.summary
                .addHeading('Ubuntu CI build skipped', 3)
                .addRaw(`${reason} The Ubuntu CI build and tests did not run.`, true)
                .addHeading('Changed files', 4)
                .addList(files.map(({ filename }) => filename))
                .write();
            }

  workflow-lint:
    name: Lint GitHub Actions workflows
    needs: changes
    if: >
      needs.changes.outputs.workflow_changed == 'true' &&
      needs.changes.outputs.skip_workflow_lint_check != 'true'
    uses: ./.github/workflows/workflow-lint.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      workflow_files: ${{ needs.changes.outputs.workflow_files }}
    permissions:
      contents: read

  build:
    name: Ubuntu CI
    needs: changes
    if: needs.changes.outputs.skip_build == 'false'
    uses: ./.github/workflows/ubuntu.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      pr_sha: ${{ github.event.pull_request.head.sha }}
      request_id: automatic
      check_name: ci
      skip_tests: false
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
