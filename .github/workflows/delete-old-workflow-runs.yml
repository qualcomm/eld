name: Delete old workflow runs

on:
  schedule:
    - cron: '30 2 * * *' # Daily at 02:30 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview deletions without removing workflow runs"
        required: false
        default: false
        type: boolean

jobs:
  delete-old-runs:
    runs-on: ubuntu-latest
    if: github.repository == 'qualcomm/eld'
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete workflow runs older than 30 days
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
        with:
          github-token: ${{ github.token }}
          script: |
            const retentionDays = 30;
            const cutoff = Date.now() - retentionDays * 24 * 60 * 60 * 1000;
            const dryRun = process.env.DRY_RUN === 'true';
            core.info(
              `${dryRun ? 'Previewing' : 'Deleting'} completed workflow runs created before ` +
              `${new Date(cutoff).toISOString()}.`
            );

            // List at the repository level so runs from workflows that have
            // since been deleted are included as well.
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                ...context.repo,
                per_page: 100,
              }
            );
            const eligibleRuns = runs
              .filter(run => {
                const createdAt = Date.parse(run.created_at);
                return run.status === 'completed' &&
                  String(run.id) !== String(context.runId) &&
                  Number.isFinite(createdAt) &&
                  createdAt < cutoff;
              })
              .sort((first, second) =>
                Date.parse(first.created_at) - Date.parse(second.created_at)
              );

            core.info(`Found ${eligibleRuns.length} completed workflow runs to ${dryRun ? 'preview' : 'delete'}.`);
            for (const run of eligibleRuns) {
              const details =
                `run ${run.id} (${run.name || run.path || 'deleted workflow'}, ` +
                `created ${run.created_at}, conclusion ${run.conclusion || 'unknown'})`;
              if (dryRun) {
                core.info(`Would delete ${details}.`);
                continue;
              }

              try {
                await github.rest.actions.deleteWorkflowRun({
                  ...context.repo,
                  run_id: run.id,
                });
                core.info(`Deleted ${details}.`);
              } catch (error) {
                // Another cleanup can remove a run after the list request.
                if (error.status === 404) {
                  core.warning(`Workflow ${details} was already deleted.`);
                  continue;
                }
                throw error;
              }
            }

            await core.summary
              .addHeading('Workflow run cleanup')
              .addTable([
                [
                  { data: 'Mode', header: true },
                  { data: 'Retention', header: true },
                  { data: 'Eligible runs', header: true },
                ],
                [dryRun ? 'Dry run' : 'Delete', `${retentionDays} days`, String(eligibleRuns.length)],
              ])
              .write();
