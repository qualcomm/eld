# Cherry-pick workflow for eld
#
# Allows developers to backport a merged PR to a release branch by posting
# a comment on the merged PR (or a GitHub Issue) with:
#
#   /cherry-pick release/23.x
#
# Multiple targets in one comment are also supported:
#
#   /cherry-pick release/23.x release/22.x
#
# Uses: https://github.com/creydr/cherry-pick-action

name: Cherry Pick Workflow

on:
  # zizmor: ignore[dangerous-triggers] -- gated on the PR/comment author being a
  # COLLABORATOR/MEMBER/OWNER (see job `if:` below); checkout below never
  # overrides `ref:`, so it checks out the trusted base branch, not PR head
  # content.
  pull_request_target:
    types: [closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  cherry-pick:
    name: Cherry Pick
    runs-on: ubuntu-latest
    if: >
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.merged &&
        contains(fromJSON('["COLLABORATOR", "MEMBER", "OWNER"]'), github.event.pull_request.author_association)
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '/cherry-pick') &&
        contains(fromJSON('["COLLABORATOR", "MEMBER", "OWNER"]'), github.event.comment.author_association)
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cherry-pick pull request
        uses: creydr/cherry-pick-action@c0d4224d89a75edc7a4596b0ca8b5b4e18ac02be # v1.0.15
