name: Nightly LLVM Test Suite (x86_64)
# owner: BhoumikPatidar

on:
  pull_request:
    paths:
      - '.github/workflows/nightly-llvm-test-suite.yml'
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: '0 11 * * *'  # 5:00 AM CST
  workflow_dispatch:

concurrency:
  group: llvm-test-suite-${{ github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  request:
    if: |
      github.repository == 'qualcomm/eld' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      actions: write
    outputs:
      run_id: ${{ steps.enable.outputs.run_id }}
      artifact_name: ${{ steps.enable.outputs.artifact_name }}
      pr_number: ${{ steps.enable.outputs.pr_number }}
      ci_url: ${{ steps.enable.outputs.ci_url }}
    steps:
      - name: Enable LLVM test suite check
        id: enable
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.issue.number;
            const commentName = context.payload.comment.body.trim();
            const allowedAssociations = new Set([
              'COLLABORATOR',
              'MEMBER',
              'OWNER',
            ]);

            if (commentName !== 'check-llvm-test-suite' ||
                !allowedAssociations.has(context.payload.comment.author_association)) {
              core.info('Ignoring an unauthorized or unrelated issue comment.');
              return;
            }

            const label = 'llvm-test-suite-check';

            try {
              await github.rest.issues.getLabel({
                owner,
                repo,
                name: label,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: '1d76db',
                description: 'Run the LLVM test suite against the PR ELD toolset',
              });
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: [label],
            });

            const dispatchedAt = Date.now();
            const requestId = `${issueNumber}-${context.payload.comment.id}-${context.runId}-${context.runAttempt}-${commentName}`;
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'ci.yml',
              ref: context.payload.repository.default_branch,
              inputs: {
                pr_number: String(issueNumber),
                request_id: requestId,
                skip_tests: 'true',
              },
            });

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: `Enabled **${label}**. CI will rebuild the PR toolset, then this workflow will run the LLVM test suite against that ld.eld.`,
            });

            const sleep = (milliseconds) => new Promise(resolve => {
              setTimeout(resolve, milliseconds);
            });
            const artifactName = `pr-eld-toolset-${issueNumber}`;
            const runName = `CI PR #${issueNumber} (${requestId})`;

            for (let attempt = 0; attempt < 120; attempt += 1) {
              const workflowRuns = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                {
                  owner,
                  repo,
                  workflow_id: 'ci.yml',
                  event: 'workflow_dispatch',
                  per_page: 100,
                }
              );
              const dispatchedRuns = workflowRuns
                .filter(run =>
                  run.display_title === runName &&
                  new Date(run.created_at).getTime() >= dispatchedAt - 5000
                )
                .sort((left, right) => new Date(right.created_at) - new Date(left.created_at));

              for (const run of dispatchedRuns) {
                if (run.status !== 'completed') {
                  continue;
                }
                if (run.conclusion !== 'success') {
                  core.setFailed(`CI run ${run.id} finished with conclusion: ${run.conclusion}.`);
                  return;
                }

                const artifacts = await github.paginate(
                  github.rest.actions.listWorkflowRunArtifacts,
                  { owner, repo, run_id: run.id, per_page: 100 }
                );
                if (artifacts.some(artifact => artifact.name === artifactName && !artifact.expired)) {
                  core.info(`CI run ${run.id} completed and produced ${artifactName}.`);
                  core.setOutput('run_id', String(run.id));
                  core.setOutput('artifact_name', artifactName);
                  core.setOutput('pr_number', String(issueNumber));
                  core.setOutput('ci_url', run.html_url);
                  return;
                }
              }

              if (attempt < 119) {
                core.info('Waiting for the dispatched CI run to complete...');
                await sleep(30000);
              }
            }

            core.setFailed('Timed out waiting for the dispatched CI run and PR toolset artifact.');

  test-llvm-test-suite-x86_64:
    needs: request
    if: |
      always() &&
      github.repository == 'qualcomm/eld' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'issue_comment' && needs.request.outputs.run_id != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      issues: write
    env:
      ELD_SOURCE_DIR: ${{ github.workspace }}/llvm-project/llvm/tools/eld

    steps:
      - name: Checkout eld
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: llvm-project/llvm/tools/eld
          persist-credentials: true # Required for BuildStatusDataRecorder's git push to dashboard branch

      - name: Report workflow links on the PR
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        env:
          PR_NUMBER: ${{ needs.request.outputs.pr_number }}
          CI_RUN_URL: ${{ needs.request.outputs.ci_url }}
          LLVM_TEST_SUITE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.PR_NUMBER);

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: [
                'LLVM test suite workflow started.',
                '',
                `- [CI run](${process.env.CI_RUN_URL})`,
                `- [LLVM test suite run](${process.env.LLVM_TEST_SUITE_RUN_URL})`,
              ].join('\n'),
            });

      - name: Configure workflow environment variables
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/ConfigureBuildWorkflowENV

      - name: Record pre-build entry
        if: github.event_name == 'schedule'
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/BuildStatusDataRecorder
        with:
          enabled: true
          project: "llvm-project/llvm/tools/eld"
          stage: "pre-"
          workflow-name: "llvm-test-suite"
          record-mode: "record"
          status: "fail"
          run-id: ${{github.run_id}}
          arch-name: "x86_64"
          branch-name: "${{env.BUILD_BRANCH}}"

      - name: Install dependencies
        run: pip3 install lit

      - name: Fetch nightly ELD
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/FetchNightlyToolset

      - name: Overlay PR ELD toolset
        if: github.event_name == 'issue_comment' && needs.request.outputs.run_id != ''
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/FetchEldToolset
        with:
          run-id: ${{ needs.request.outputs.run_id }}
          artifact-name: ${{ needs.request.outputs.artifact_name }}
          tarball: install-pr-toolset.tar.xz

      - name: Clone LLVM test suite
        run: |
          git clone --depth 1 https://github.com/llvm/llvm-test-suite.git

      - name: Configure test suite
        run: |
          ELD_BIN=$(which ld.eld)
          LIB_DIR="$(dirname "$ELD_BIN")/../lib"
          RT_LIB_DIR="$LIB_DIR/x86_64-unknown-linux-gnu"
          # TEST_SUITE_SUBDIRS is left unset, so llvm-test-suite/CMakeLists.txt
          # runs its own auto-discovery.
          # That resolves to:
          #   Bitcode;External;MicroBenchmarks;MultiSource;SingleSource;tools/test
          #
          # What runs:
          #   - Bitcode: runs. Needs -DELD_ENABLE_SYMBOL_VERSIONING=ON, which the
          #     fetched nightly toolchain is built with.
          #   - MicroBenchmarks, MultiSource, SingleSource, tools/test: run.
          #
          # What is discovered but contributes nothing on this runner:
          #   - External: configures, but every benchmark under it is gated on
          #     its own TEST_SUITE_<NAME>_ROOT pointing at licensed/proprietary
          #     sources (e.g. TEST_SUITE_SPEC2000_ROOT) that are not supplied
          #     here, so none of it builds.
          #
          # What auto-discovery drops before we ever see it:
          #   - CTMark: removed by the suite itself; it is just symlinks into
          #     MultiSource, so keeping it would double-build those tests.
          #   - Fortran: removed because TEST_SUITE_FORTRAN defaults OFF unless
          #     Fortran is already in TEST_SUITE_SUBDIRS, which it isn't since
          #     we leave that variable unset.
          #   - litsupport, tools: removed; these are the lit harness and its
          #     support utilities, not tests (tools/test is added back above).
          #
          # Not part of the CMake-driven build:
          #   ABI-Testsuite, ClangAnalyzer, LNTBased, litsupport-tests,
          #   test-suite-externals, utils.

          cmake -G Ninja \
            -S llvm-test-suite \
            -B build-llvm-test-suite \
            -DCMAKE_C_COMPILER=$(which clang) \
            -DCMAKE_CXX_COMPILER=$(which clang++) \
            -DCMAKE_C_FLAGS="--ld-path=$ELD_BIN" \
            -DCMAKE_CXX_FLAGS="--ld-path=$ELD_BIN -stdlib=libc++" \
            -DCMAKE_EXE_LINKER_FLAGS="--ld-path=$ELD_BIN -stdlib=libc++ -Wl,-rpath,$LIB_DIR -Wl,-rpath,$RT_LIB_DIR" \
            -DTEST_SUITE_RUN_TYPE=nightly

      - name: Build test suite
        run: |
          ninja -C build-llvm-test-suite -j$(nproc) -k 0

      - name: Run tests
        run: |
          set -o pipefail
          lit -j$(nproc) build-llvm-test-suite 2>&1 | tee test-output.txt

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: llvm-test-suite-results
          path: test-output.txt
          # Keep a fallback copy in case the workflow fails before cleanup.
          retention-days: 7

      - name: Update build entry
        if: github.event_name == 'schedule'
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/BuildStatusDataRecorder
        with:
          enabled: true
          project: "llvm-project/llvm/tools/eld"
          stage: "post-"
          workflow-name: "llvm-test-suite"
          record-mode: "update"
          status: "pass"
          run-id: ${{github.run_id}}
          arch-name: "x86_64"
          branch-name: "${{env.BUILD_BRANCH}}"

      - name: Delete older LLVM test-suite results
        if: success() && github.event_name != 'workflow_run'
        continue-on-error: true
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/DeleteOldArtifacts
        with:
          artifact-names: llvm-test-suite-results
