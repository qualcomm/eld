name: DeleteOldArtifacts
description: >
  Delete artifacts selected by exact name or name prefix when they belong to an
  older workflow run. Matching is repository-wide; names and prefixes are
  combined, and either can match an artifact. Artifacts from the current or a
  newer run, expired artifacts, and artifacts without run metadata are kept.
  Requires the calling job to have actions: write permission.

inputs:
  artifact-names:
    description: >
      Newline-separated exact artifact names to delete. Use names that identify
      only artifacts that are safe to remove.
    required: false
    default: ""
  artifact-name-prefixes:
    description: >
      Newline-separated prefixes; artifacts whose names start with any prefix
      are eligible for deletion. Include the PR number in PR-specific prefixes
      to avoid matching artifacts from other PRs.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Delete older artifacts
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
      with:
        github-token: ${{ github.token }}
        script: |
          const lines = value => value.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
          const names = new Set(lines(process.env.ARTIFACT_NAMES));
          const prefixes = lines(process.env.ARTIFACT_NAME_PREFIXES);

          // Names and prefixes are the deletion boundary. A run may provide
          // exact names, prefixes, or both.
          if (names.size === 0 && prefixes.length === 0) {
            core.setFailed('Provide artifact-names or artifact-name-prefixes.');
            return;
          }

          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const currentRunId = Number(context.runId);
          const requests = [...names].map(name =>
            github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner, repo, name, per_page: 100,
            })
          );

          if (prefixes.length > 0) {
            requests.push(github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner, repo, per_page: 100,
            }));
          }

          const results = await Promise.all(requests);
          const artifacts = new Map();
          for (const result of results) {
            for (const artifact of result) {
              if (names.has(artifact.name) ||
                  prefixes.some(prefix => artifact.name.startsWith(prefix))) {
                artifacts.set(artifact.id, artifact);
              }
            }
          }

          for (const artifact of artifacts.values()) {
            const artifactRunId = Number(artifact.workflow_run?.id);
            // Preserve expired artifacts, artifacts without run metadata, and
            // artifacts from this run or a newer concurrent run.
            if (artifact.expired || !Number.isFinite(artifactRunId) ||
                artifactRunId >= currentRunId) {
              continue;
            }

            core.info(`Deleting older artifact ${artifact.name} (${artifact.id})`);
            try {
              await github.rest.actions.deleteArtifact({
                owner, repo, artifact_id: artifact.id,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info(`Artifact ${artifact.id} was already deleted.`);
            }
          }
      env:
        ARTIFACT_NAMES: ${{ inputs.artifact-names }}
        ARTIFACT_NAME_PREFIXES: ${{ inputs.artifact-name-prefixes }}
