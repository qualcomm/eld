name: Artifact Storage Report

on:
  # Allows an on-demand report in addition to the daily scheduled run.
  workflow_dispatch:
  schedule:
    # Run once daily at 09:00 UTC.
    - cron: "0 9 * * *"

# The workflow reads Actions metadata and pushes the generated report to
# the dashboard branch.
permissions:
  actions: read
  contents: write

jobs:
  artifact-storage-report:
    runs-on: ubuntu-latest

    steps:
      - name: Generate artifact report
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;

            // Displays storage totals in the same human-readable format used
            // for each artifact in the generated report.
            function formatBytes(bytes) {
              const units = ["B", "KB", "MB", "GB", "TB"];
              let value = bytes;
              let unit = 0;

              while (value >= 1024 && unit < units.length - 1) {
                value /= 1024;
                unit++;
              }

              return `${value.toFixed(2)} ${units[unit]}`;
            }

            // GitHub returns at most 100 artifacts per API request. Continue
            // until a partial page is received so the report includes all of
            // the repository's artifacts.
            async function listAllArtifacts() {
              const artifacts = [];

              for (let page = 1; ; page++) {
                const { data } =
                  await github.rest.actions.listArtifactsForRepo({
                    owner,
                    repo,
                    per_page: 100,
                    page
                  });

                artifacts.push(...data.artifacts);

                if (data.artifacts.length < 100) {
                  return artifacts;
                }
              }
            }

            // Artifact records provide a workflow-run ID but not a workflow
            // name. Look up each distinct run once and cache the result so
            // artifacts can be grouped by workflow without duplicate calls.
            const workflowNames = new Map();

            async function workflowNameFor(artifact) {
              const runId = artifact.workflow_run?.id;

              if (!runId) {
                return "Unknown";
              }

              if (!workflowNames.has(runId)) {
                try {
                  const { data } =
                    await github.rest.actions.getWorkflowRun({
                      owner,
                      repo,
                      run_id: runId
                    });

                  workflowNames.set(
                    runId,
                    data.name || `Workflow ${data.workflow_id}`
                  );
                } catch (error) {
                  // A deleted run must not prevent the remaining artifacts
                  // from being included in the report.
                  core.warning(
                    `Could not load workflow run ${runId}: ${error.message}`
                  );
                  workflowNames.set(runId, "Unknown");
                }
              }

              return workflowNames.get(runId);
            }

            const artifacts = await listAllArtifacts();
            const workflows = new Map();
            let totalBytes = 0;
            let activeArtifacts = 0;

            // Exclude expired artifacts from the report.
            for (const artifact of artifacts) {
              if (artifact.expired) {
                continue;
              }

              const sizeBytes = artifact.size_in_bytes || 0;
              const workflowName = await workflowNameFor(artifact);
              const artifactGroup = workflows.get(workflowName) || {
                name: workflowName,
                totalBytes: 0,
                artifacts: []
              };

              totalBytes += sizeBytes;
              artifactGroup.totalBytes += sizeBytes;
              activeArtifacts++;

              artifactGroup.artifacts.push({
                name: artifact.name,
                size: formatBytes(sizeBytes),
                createdAt: artifact.created_at,
                expiresAt: artifact.expires_at
              });

              workflows.set(workflowName, artifactGroup);
            }

            // Keep the JSON schema limited to the requested summary and
            // workflow-wise artifact lists. Internal byte totals are used
            // solely to order the workflows and are not written to the file.
            const report = {
              summary: {
                artifactCount: activeArtifacts,
                activeArtifacts,
                totalSize: formatBytes(totalBytes)
              },
              workflows: [...workflows.values()]
                .sort((left, right) => right.totalBytes - left.totalBytes)
                .map(workflow => ({
                  name: workflow.name,
                  artifacts: workflow.artifacts
                }))
            };

            fs.mkdirSync("reports", { recursive: true });
            fs.writeFileSync(
              "reports/artifact-storage-report.json",
              JSON.stringify(report, null, 2)
            );

      # Save the JSON to dashboard
      - name: Checkout ELD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: llvm-project/llvm/tools/eld

      - name: Update Build Dashboard
        shell: bash
        run: |
            DASH_DIR="$(mktemp -d)"
            ls -lh reports/artifact-storage-report.json
            cat reports/artifact-storage-report.json
            cp reports/artifact-storage-report.json "${DASH_DIR}/"
            cd llvm-project/llvm/tools/eld
            git config user.name 'github-actions'
            git config user.email 'github-actions@github.com'
            git fetch --all
            git checkout dashboard
            git reset --hard origin/dashboard
            cp "${DASH_DIR}/artifact-storage-report.json" .
            git add .
            git commit -m "Update artifacts storage data for dashboard"
            git push -f origin HEAD:refs/heads/dashboard
            until git push -f origin HEAD:refs/heads/dashboard; do
              sleep 5
              git fetch --all
              git reset --hard origin/dashboard
              cp "${DASH_DIR}/reports/artifact-storage-report.json" .
              echo "$(date) -> Artifacts Storage Data Added." >> dash.log
              git add .
              git commit -m "Update artifacts storage data for dashboard"
            done
        continue-on-error: true
