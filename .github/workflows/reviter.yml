name: Nightly check using reverse iterators
run-name: "Reverse iterators ${{ inputs.pr_number && format('PR #{0} @{1}', inputs.pr_number, inputs.pr_sha) || 'nightly' }}"
# owner: quic-seaswara

on:
  schedule:
    - cron: '0 8 * * *' # Runs daily at 2:00 AM CST
  workflow_call:
    inputs:
      pr_number:
        description: "Pull request number"
        required: false
        type: string
        default: ""
      pr_sha:
        description: "Exact pull request head SHA"
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  reverse-iterators:
    runs-on: ubuntu-latest
    if: |
      github.repository == 'qualcomm/eld' &&
       (github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'workflow_call' ||
        inputs.pr_sha != '')
    concurrency:
      group: ${{ inputs.pr_sha && format('reviter-pr-{0}-{1}', inputs.pr_number, inputs.pr_sha) || 'reviter-nightly' }}
      cancel-in-progress: true
    env:
      ELD_REF: ${{ inputs.pr_sha || github.ref_name }}

    steps:
      - name: Configure LLVM 23 apt repository
        run: |
          sudo install -d -m 0755 /usr/share/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/llvm-archive-keyring.gpg >/dev/null
          UBUNTU_CODENAME="$(. /etc/os-release && echo "${VERSION_CODENAME}")"
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/${UBUNTU_CODENAME}/ llvm-toolchain-${UBUNTU_CODENAME}-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-23.list >/dev/null

      - name: Install libc++ and libc++abi
        run: |
          sudo apt update
          sudo apt install -y clang-23 libc++-23-dev libc++abi-23-dev ccache libclang-rt-23-dev
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"

      - name: Build and Test with Clang and show versions
        run: |
          echo "clang version"
          clang --version
          echo "clang++ version"
          clang++ -stdlib=libc++ --version
          dpkg -L clang-23
          echo '#include <iostream>' > test.cpp
          echo 'int main() { std::cout << "Hello, Clang on Ubuntu!" << std::endl; return 0; }' >> test.cpp
          clang++ -std=c++17 -stdlib=libc++ test.cpp -o test_clang
          ./test_clang

      - name: CPU and Memory information
        run: |
          echo "Number of CPUs:"
          nproc --all # or grep -c ^processor /proc/cpuinfo
          echo "Memory information:"
          free -h # or cat /proc/meminfo

      - name: Checkout llvm-project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llvm/llvm-project
          path: llvm-project
          ref: main
          persist-credentials: false

      - name: Checkout eld
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qualcomm/eld
          path: llvm-project/llvm/tools/eld
          ref: ${{ env.ELD_REF }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure workflow environment variables
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/ConfigureBuildWorkflowENV

      - name: Record pre-build entry
        if: github.event_name == 'schedule'
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/BuildStatusDataRecorder
        with:
          enabled: true
          project: "llvm-project/llvm/tools/eld"
          stage: "pre-"
          workflow-name: "reverse_iterator"
          record-mode: "record"
          status: "fail"
          run-id: ${{ github.run_id }}
          arch-name: "all"
          branch-name: "${{ env.BUILD_BRANCH }}"

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ${{ github.workspace }}/obj/ccache
          key: reviter-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            reviter-ccache-${{ runner.os }}-

      - name: Run CMake
        run: |
          mkdir -p obj
          cd obj
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
            -DLLVM_REVERSE_ITERATION=ON \
            -DLLVM_ENABLE_PROJECTS="llvm;clang;clang-tools-extra" \
            -DCLANG_ENABLE_CIR=OFF \
            -DCMAKE_C_COMPILER:STRING="$(command -v clang)" \
            -DCMAKE_CXX_COMPILER:STRING="$(command -v clang++)" \
            -DCMAKE_CXX_FLAGS:STRING="-stdlib=libc++" \
            -DLLVM_TARGETS_TO_BUILD:STRING="ARM;AArch64;RISCV;Hexagon;X86" \
            -DLLVM_CCACHE_BUILD:BOOL=ON \
            -DLLVM_CCACHE_DIR:STRING="$PWD/ccache/" \
            -DLLVM_ENABLE_SPHINX=OFF \
            ../llvm-project/llvm

      - name: Build Project
        id: build_project
        run: ninja -C obj -j8

      - name: Prune ccache before save
        if: always() && steps.build_project.outcome == 'success'
        env:
          CCACHE_DIR: ${{ github.workspace }}/obj/ccache
        run: ccache --evict-older-than 7200s

      - name: Save ccache
        if: always() && steps.build_project.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ${{ github.workspace }}/obj/ccache
          key: reviter-ccache-${{ runner.os }}-${{ github.run_id }}

      - name: Delete old ccache entries
        if: always() && steps.build_project.outcome == 'success'
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/DeleteOldCaches
        with:
          cache-key-prefixes: reviter-ccache-${{ runner.os }}-

      - name: Run tests
        run: ninja -C obj -j8 check-eld

      - name: Update build entry
        if: github.event_name == 'schedule'
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/BuildStatusDataRecorder
        with:
          enabled: true
          project: "llvm-project/llvm/tools/eld"
          stage: "post-"
          workflow-name: "reverse_iterator"
          record-mode: "update"
          status: "pass"
          run-id: ${{ github.run_id }}
          arch-name: "all"
          branch-name: "${{ env.BUILD_BRANCH }}"
