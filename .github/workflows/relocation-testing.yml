name: Relocation testing framework
run-name: "Relocation testing ${{ inputs.pr_number && format('PR #{0} @{1}', inputs.pr_number, inputs.pr_sha) || 'nightly' }}"

on:
  # zizmor: ignore[dangerous-triggers] -- Nightly check only runs on a schedule
  # against main (never PR-triggered); this job only downloads a named
  # artifact from it, it never checks out or executes the triggering run's code.
  workflow_run:
    workflows: [Nightly check]
    types: [completed]
  workflow_dispatch:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull request number"
        required: false
        type: string
        default: ""
      pr_sha:
        description: "Exact pull request head SHA"
        required: false
        type: string
        default: ""
      toolset_run_id:
        description: "Workflow run containing the PR ELD toolset artifact"
        required: false
        type: string
        default: ""
      toolset_artifact:
        description: "Name of the PR ELD toolset artifact"
        required: false
        type: string
        default: ""

jobs:
  relocation-testing:
    if: |
      github.repository == 'qualcomm/eld' &&
       ((github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success') ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'workflow_call' ||
        inputs.pr_sha != '')
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ inputs.pr_sha && format('relocation-testing-pr-{0}-{1}', inputs.pr_number, inputs.pr_sha) || 'relocation-testing-nightly' }}
      cancel-in-progress: true
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out ELD sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_sha || github.sha }}
          path: llvm-project/llvm/tools/eld
          persist-credentials: ${{ inputs.pr_sha == '' }}

      - name: Configure workflow environment variables
        if: inputs.pr_sha == ''
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/ConfigureBuildWorkflowENV

      - name: Record pre-build entry
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/BuildStatusDataRecorder
        with:
          enabled: true
          project: "llvm-project/llvm/tools/eld"
          stage: "pre-"
          workflow-name: "relocation-testing"
          record-mode: "record"
          status: "fail"
          run-id: ${{ github.run_id }}
          arch-name: "all"
          branch-name: "${{ env.BUILD_BRANCH }}"

      - name: Install ARM emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user

      - name: Fetch nightly LLVM toolchain
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/FetchNightlyToolset

      - name: Preserve nightly compiler runtimes
        if: inputs.pr_sha != ''
        run: |
          mkdir -p nightly-cxx-runtime
          find "${GITHUB_WORKSPACE}/inst/lib" -maxdepth 1 \( \
            -name 'libc++.so*' -o -name 'libc++abi.so*' \
          \) -exec cp -a {} nightly-cxx-runtime/ \;

      - name: Overlay PR ELD toolset
        if: inputs.pr_sha != ''
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/FetchEldToolset
        with:
          run-id: ${{ inputs.toolset_run_id }}
          artifact-name: ${{ inputs.toolset_artifact }}
          tarball: install-pr-toolset.tar.xz

      - name: Restore nightly compiler runtimes
        if: inputs.pr_sha != ''
        run: cp -a nightly-cxx-runtime/. "${GITHUB_WORKSPACE}/inst/lib/"

      - name: Run relocation framework
        shell: bash
        env:
          LD_LIBRARY_PATH: "${{ github.workspace }}/inst/lib:${{ github.workspace }}/inst/lib/x86_64-unknown-linux-gnu"
        run: |
          set -uo pipefail
          framework="${GITHUB_WORKSPACE}/llvm-project/llvm/tools/eld/utils/relocation-testing-framework/framework.py"
          results_dir="${RUNNER_TEMP}/relocation-testing"
          mkdir -p "${results_dir}"
          test_status=0

          for arch in x86_64 arm; do
            report="${results_dir}/${arch}-report.txt"
            if ! python3 "${framework}" \
                --arch="${arch}" \
                --mode=run \
                --output-dir="${results_dir}/${arch}" > "${report}" 2>&1; then
              test_status=1
            fi
            cat "${report}"
          done

          exit "${test_status}"

      - name: Update build entry
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/BuildStatusDataRecorder
        with:
          enabled: true
          project: "llvm-project/llvm/tools/eld"
          stage: "post-"
          workflow-name: "relocation-testing"
          record-mode: "update"
          status: "pass"
          run-id: ${{ github.run_id }}
          arch-name: "all"
          branch-name: "${{ env.BUILD_BRANCH }}"

      - name: Upload relocation test reports and artifacts
        id: upload_results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.pr_number && format('relocation-testing-results-pr-{0}', inputs.pr_number) || 'relocation-testing-results-nightly' }}
          path: ${{ runner.temp }}/relocation-testing/
          if-no-files-found: ignore
          retention-days: 7

      - name: Delete older relocation test artifacts
        if: always() && steps.upload_results.outcome == 'success'
        continue-on-error: true
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/DeleteOldArtifacts
        with:
          artifact-names: ${{ inputs.pr_number && format('relocation-testing-results-pr-{0}', inputs.pr_number) || 'relocation-testing-results-nightly' }}
          workflow-id: ${{ inputs.pr_sha != '' && 'pr-comment-router.yml' || 'relocation-testing.yml' }}
