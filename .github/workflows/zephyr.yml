name: Zephyr with ELD
# owner: quic-areg

# Run Zephyr nightly or against a PR's ELD toolset.

on:
  workflow_run:
    workflows: [Nightly check]
    types: [completed]
  workflow_dispatch:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull request number used to scope Zephyr artifacts"
        required: false
        type: string
        default: ""
      pr_sha:
        description: "Exact pull request head SHA"
        required: false
        type: string
        default: ""
      toolset_run_id:
        description: "CI workflow run containing the PR ELD toolset artifact"
        required: false
        type: string
        default: ""
      toolset_artifact:
        description: "Artifact name for the ELD toolset"
        required: false
        type: string
        default: ""

jobs:
  resolve:
    if: |
      (github.event_name == 'workflow_run' &&
       github.repository == 'qualcomm/eld' &&
       github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      toolset_run_id: ${{ steps.find.outputs.toolset_run_id }}
      toolset_artifact: ${{ steps.find.outputs.toolset_artifact }}
      toolset_tarball: ${{ steps.find.outputs.toolset_tarball }}
      artifact_workflow_id: ${{ steps.find.outputs.artifact_workflow_id }}
      artifact_pull_request_number: ${{ steps.find.outputs.artifact_pull_request_number }}
      pr_number: ${{ steps.find.outputs.pr_number }}
    steps:
      - name: Resolve toolset
        id: find
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_SHA: ${{ inputs.pr_sha }}
          TOOLSET_RUN_ID: ${{ inputs.toolset_run_id }}
          TOOLSET_ARTIFACT: ${{ inputs.toolset_artifact }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = (process.env.PR_NUMBER || '').trim();
            const prSha = (process.env.PR_SHA || '').trim();

            if (prSha) {
              if (!process.env.TOOLSET_RUN_ID || !process.env.TOOLSET_ARTIFACT) {
                core.setFailed('PR Zephyr runs require a toolset run ID and artifact name.');
                return;
              }
              core.setOutput('run_id', process.env.TOOLSET_RUN_ID);
              core.setOutput('toolset_run_id', process.env.TOOLSET_RUN_ID);
              core.setOutput('toolset_artifact', process.env.TOOLSET_ARTIFACT);
              core.setOutput('toolset_tarball', 'install-pr-toolset.tar.xz');
              core.setOutput('artifact_workflow_id', 'zephyr.yml');
              core.setOutput('artifact_pull_request_number', prNumber);
              core.setOutput('pr_number', prNumber);
              return;
            }

            const workflowRun = context.payload.workflow_run;
            let runId = workflowRun?.id;
            if (!runId) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'nightly-test.yml',
                status: 'success',
                per_page: 1,
              });
              const runs = response.data.workflow_runs || [];
              if (!runs.length) {
                core.setFailed('No successful nightly-test.yml run found.');
                return;
              }
              runId = runs[0].id;
            }
            core.setOutput('run_id', String(runId));
            core.setOutput('toolset_run_id', String(runId));
            core.setOutput('toolset_artifact', 'install-nightly-toolchain.tar.xz');
            core.setOutput('toolset_tarball', 'install-nightly-toolchain.tar.xz');
            core.setOutput('artifact_workflow_id', 'zephyr.yml');
            core.setOutput('artifact_pull_request_number', '');
            core.setOutput('pr_number', '');

  zephyr-build-and-test:
    needs: resolve
    if: needs.resolve.outputs.run_id != ''
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/ci-base:main
      options: --user 0
    strategy:
      fail-fast: false
      matrix:
        target:
          - { board: qemu_riscv32,     arch: riscv32,  extra_args: CONFIG_PICOLIBC_USE_TOOLCHAIN=y }
          - { board: qemu_riscv32_xip, arch: riscv32,  extra_args: CONFIG_PICOLIBC_USE_TOOLCHAIN=y }
          - { board: qemu_riscv64,     arch: riscv64,  extra_args: CONFIG_PICOLIBC_USE_TOOLCHAIN=y }
          - { board: qemu_cortex_m3,   arch: arm,      extra_args: CONFIG_PICOLIBC_USE_TOOLCHAIN=y }
          - { board: qemu_cortex_a53,  arch: aarch64,  extra_args: CONFIG_PICOLIBC_USE_TOOLCHAIN=y }
          - { board: qemu_x86_64,      arch: x86_64,   toolchain: zephyr-sdk, extra_args: "" }
    env:
      CPULLVM_VERSION: "23.1.0"
      CPULLVM_DIR: /opt/cpullvm
      CCACHE_DIR: /root/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
      CCACHE_COMPRESS: "1"
      CCACHE_COMPILERCHECK: "content"

    steps:
      - name: Checkout eld
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: llvm-project/llvm/tools/eld

      - name: Prepare ccache dir
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --version | head -1

      - name: Restore ccache
        if: matrix.target.arch == 'riscv64'
        id: restore-ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.target.arch }}-${{ matrix.target.toolchain || 'cpullvm' }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.target.arch }}-${{ matrix.target.toolchain || 'cpullvm' }}-

      - name: Configure ccache
        env:
          ARCH: ${{ matrix.target.arch }}
        run: |
          if [ "$ARCH" != "riscv64" ]; then
            echo "CCACHE_DISABLE=1" >> "$GITHUB_ENV"
            ccache --zero-stats
            exit 0
          fi

          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          ccache --set-config=max_size=2G
          ccache --zero-stats

      - name: ccache stats (before build)
        run: ccache -s -v || ccache -s

      - name: Record pre-build entry
        if: needs.resolve.outputs.artifact_pull_request_number == ''
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/BuildStatusDataRecorder
        with:
          enabled: true
          project: "llvm-project/llvm/tools/eld"
          stage: "pre-"
          workflow-name: "zephyr"
          record-mode: "record"
          status: "fail"
          run-id: ${{github.run_id}}
          arch-name: ${{ matrix.target.arch }}
          branch-name: "main"

      - name: Fetch ELD toolset
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/FetchEldToolset
        with:
          run-id: ${{ needs.resolve.outputs.toolset_run_id }}
          artifact-name: ${{ needs.resolve.outputs.toolset_artifact }}
          tarball: ${{ needs.resolve.outputs.toolset_tarball }}

      - name: Install cpullvm toolchain and splice ELD
        if: (matrix.target.toolchain || 'cpullvm') == 'cpullvm'
        run: |
          # Download cpullvm release
          wget -q --tries=3 --retry-on-http-error=429,500,502,503,504 --waitretry=5 https://github.com/qualcomm/cpullvm-toolchain/releases/download/cpullvm-${CPULLVM_VERSION}/cpullvm-${CPULLVM_VERSION}-Linux-x86_64-Ubuntu24.tar.xz
          tar -xf cpullvm-${CPULLVM_VERSION}-Linux-x86_64-Ubuntu24.tar.xz
          mv cpullvm-${CPULLVM_VERSION}-Linux-x86_64-Ubuntu24 ${CPULLVM_DIR}
          rm cpullvm-${CPULLVM_VERSION}-Linux-x86_64-Ubuntu24.tar.xz

          # Splice ELD (nightly or PR build) into cpullvm
          cp inst/bin/ld.eld ${CPULLVM_DIR}/bin/ld.eld
          cp inst/lib/libLW.so.5 ${CPULLVM_DIR}/lib/libLW.so.5
          ln -sf libLW.so.5 ${CPULLVM_DIR}/lib/libLW.so

          # ld.eld/libLW.so.5 link against the build's libc++; cpullvm/lib has
          # none, so bundle the matching libc++/libc++abi.
          cp -P inst/lib/libc++.so.1*    ${CPULLVM_DIR}/lib/
          cp -P inst/lib/libc++abi.so.1* ${CPULLVM_DIR}/lib/

          echo "ELD version:"
          ${CPULLVM_DIR}/bin/ld.eld --version
          echo "cpullvm clang version:"
          ${CPULLVM_DIR}/bin/clang --version | head -1

          {
            echo "TOOLCHAIN_VARIANT=host/llvm"
            echo "ELD_SELECT_ARGS=-DCONFIG_LLVM_USE_ELD=y -DCONFIG_COMPILER_RT_RTLIB=y"
            # Mbed TLS and TF-PSA-Crypto have a separate -Werror default that
            # twister's -W does not disable.
            echo "ELD_SELECT_TWISTER_ARGS=-x=CONFIG_LLVM_USE_ELD=y" \
              "-x=CONFIG_COMPILER_RT_RTLIB=y" \
              "-x=MBEDTLS_FATAL_WARNINGS=OFF"
          } >> "$GITHUB_ENV"

      - name: Select ELD for the Zephyr SDK GCC
        if: (matrix.target.toolchain || 'cpullvm') == 'zephyr-sdk'
        shell: bash
        run: |
          ln -sf "$PWD/inst/bin/ld.eld" "$PWD/inst/bin/ld"
          {
            echo "TOOLCHAIN_VARIANT=zephyr"
            echo "ELD_SELECT_ARGS=-DEXTRA_LDFLAGS=-B$PWD/inst/bin -DGNULD_LINKER=$PWD/inst/bin/ld -DGNULD_LINKER_IS_BFD=OFF"
            echo "ELD_SELECT_TWISTER_ARGS=-x=EXTRA_LDFLAGS=-B$PWD/inst/bin -x=GNULD_LINKER=$PWD/inst/bin/ld -x=GNULD_LINKER_IS_BFD=OFF"
          } >> "$GITHUB_ENV"

      - name: Clone Zephyr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zephyrproject-rtos/zephyr
          path: zephyr

      - name: Set safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE/zephyr"

      - name: West setup
        shell: bash
        run: |
          cd zephyr
          west init -l .
          # SoC-gated vendor HALs no QEMU board we build uses. Never compiled,
          # only waste disk. Keep cmsis + cmsis_6 (Cortex-M core headers).
          exclude='hal_adi|hal_afbr|hal_ambiq|hal_atmel|hal_bouffalolab|hal_espressif|hal_ethos_u|hal_gigadevice|hal_infineon|hal_intel|hal_microchip|hal_nordic|hal_nuvoton|hal_nxp|hal_openisa|hal_quicklogic|hal_realtek|hal_renesas|hal_rpi_pico|hal_sifli|hal_silabs|hal_st|hal_stm32|hal_tdk|hal_telink|hal_ti|hal_wch|hal_wurthelektronik|hal_xtensa|nrf_hw_models'
          # Deny-list: modules upstream adds later are still fetched.
          mapfile -t projects < <(west list --format '{name}' | grep -vxE "manifest|$exclude")
          # Shallow + narrow: full fetch has run the container disk out of space.
          west update --narrow --fetch-opt=--depth=1 "${projects[@]}"

      - name: Install Zephyr SDK hosttools
        shell: bash
        run: |
          if [ "${{ matrix.target.toolchain || 'cpullvm' }}" = "zephyr-sdk" ]; then
            gnu_toolchains=(-t "${{ matrix.target.arch }}-zephyr-elf")
          else
            gnu_toolchains=(--no-gnu-toolchains)
          fi
          west sdk install "${gnu_toolchains[@]}" \
            --install-base /opt/toolchains \
            --personal-access-token "${{ github.token }}"

      - name: Build hello_world for ${{ matrix.target.board }} with ELD
        shell: bash
        env:
          BOARD: ${{ matrix.target.board }}
          EXTRA_ARGS: ${{ matrix.target.extra_args }}
        run: |
          cd zephyr
          source zephyr-env.sh
          export ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains/
          export ZEPHYR_TOOLCHAIN_VARIANT=${TOOLCHAIN_VARIANT}
          export LLVM_TOOLCHAIN_PATH=${CPULLVM_DIR}
          west build -p always -b "$BOARD" samples/hello_world -- \
            $ELD_SELECT_ARGS \
            ${EXTRA_ARGS:+-D"$EXTRA_ARGS"}

      - name: Run hello_world on QEMU
        shell: bash
        run: |
          cd zephyr
          source zephyr-env.sh
          # No pipe to tee: qemu_riscv32_xip uses -machine sifive_e which has
          # no QEMU exit mechanism, so QEMU outlives `timeout` and would keep
          # tee blocked. pkill below frees the CPU for the next step.
          timeout -k 1s 5s west build -t run > run_output.log 2>&1 || true
          pkill -KILL -f "qemu-system.*build/zephyr/zephyr.elf" 2>/dev/null || true
          cat run_output.log
          if grep -q "Hello World" run_output.log; then
            echo "hello_world executed successfully"
          else
            echo "hello_world did not produce expected output"
            exit 1
          fi

      - name: Run twister tests for ${{ matrix.target.board }} with ELD
        shell: bash
        env:
          BOARD: ${{ matrix.target.board }}
          TEST_SCOPE: ${{ needs.resolve.outputs.artifact_pull_request_number != '' && 'tests/kernel' || 'tests' }}
          EXTRA_ARGS: ${{ matrix.target.extra_args }}
        run: |
          cd zephyr
          source zephyr-env.sh
          export ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains/
          export LLVM_TOOLCHAIN_PATH=${CPULLVM_DIR}
          west twister -W -p "$BOARD" \
            -T "$TEST_SCOPE" \
            --quarantine-list "$GITHUB_WORKSPACE/llvm-project/llvm/tools/eld/.github/zephyr-quarantine.yml" \
            -M pass \
            --inline-logs \
            --timestamps \
            -j 3 \
            -v \
            --retry-failed 2 \
            --retry-interval 10 \
            -x=ZEPHYR_TOOLCHAIN_VARIANT=${TOOLCHAIN_VARIANT} \
            $ELD_SELECT_TWISTER_ARGS \
            ${EXTRA_ARGS:+-x="$EXTRA_ARGS"}

      - name: Upload twister results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: zephyr-twister-results-${{ matrix.target.board }}
          # Keep a fallback copy in case the workflow fails before cleanup.
          retention-days: 7
          path: |
            zephyr/twister-out/twister.log
            zephyr/twister-out/twister.json

      - name: ccache stats (after build)
        if: always()
        run: ccache -s -v || ccache -s

      - name: Prune ccache before save
        if: |
          success() &&
          needs.resolve.outputs.artifact_pull_request_number == '' &&
          matrix.target.arch == 'riscv64'
        run: ccache --cleanup

      - name: Save ccache
        if: |
          success() &&
          needs.resolve.outputs.artifact_pull_request_number == '' &&
          matrix.target.arch == 'riscv64'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.target.arch }}-${{ matrix.target.toolchain || 'cpullvm' }}-${{ github.run_id }}

      - name: Update build entry
        if: success() && needs.resolve.outputs.artifact_pull_request_number == ''
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/BuildStatusDataRecorder
        with:
          enabled: true
          project: "llvm-project/llvm/tools/eld"
          stage: "post-"
          workflow-name: "zephyr"
          record-mode: "update"
          status: "pass"
          run-id: ${{github.run_id}}

      - name: Delete older Zephyr results
        if: success()
        continue-on-error: true
        uses: ./.github/workflows/DeleteOldArtifacts
        with:
          artifact-names: zephyr-twister-results-${{ matrix.target.board }}
          workflow-id: zephyr.yml
          pull-request-number: ${{ needs.resolve.outputs.artifact_pull_request_number }}
          arch-name: ${{ matrix.target.arch }}
          branch-name: "main"
