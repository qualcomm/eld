name: Benchmark Baseline (main)

# Runs on bot02 self-hosted runner whenever main advances.
# Builds ELD from main (standalone, against pre-built LLVM on bot02),
# runs the benchmark, and writes baseline.json to a persistent path on bot02
# so benchmark-pr.yml can compare against it without any third-party actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialise baseline runs so we never write baseline.json concurrently.
concurrency:
  group: eld-benchmark-baseline
  cancel-in-progress: false

jobs:
  baseline:
    name: Build and benchmark ELD on main
    runs-on: [self-hosted, eld-benchmark]

    env:
      LLVM_CMAKE_DIR: /local/mnt/workspace/fankita/llvm-project/obj/lib/cmake/llvm
      REPRODUCERS_DIR: /nix/store/7bnlb36ld38yj0yc7c9cgby8ph00sgj6-lld-speed-test
      BASELINE_PATH: /local/mnt/workspace/fankita/eld-benchmark/baseline.json
      BUILD_DIR: /tmp/eld-baseline-build

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: eld

      - name: Build ELD (main, standalone)
        run: |
          cmake -G Ninja \
            -S ${{ github.workspace }}/eld \
            -B ${{ env.BUILD_DIR }} \
            -DELD_USE_EXTERNAL_LLVM=ON \
            -DLLVM_DIR=${{ env.LLVM_CMAKE_DIR }} \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build ${{ env.BUILD_DIR }} --target ld.eld -j$(nproc)

      - name: Run benchmark (main baseline)
        run: |
          bash ${{ github.workspace }}/eld/utils/benchmark/run_benchmark.sh \
            --eld ${{ env.BUILD_DIR }}/bin/ld.eld \
            --reproducers ${{ env.REPRODUCERS_DIR }} \
            > /tmp/baseline.json

      - name: Save baseline
        run: |
          mkdir -p $(dirname ${{ env.BASELINE_PATH }})
          cp /tmp/baseline.json ${{ env.BASELINE_PATH }}
          echo "Baseline saved to ${{ env.BASELINE_PATH }}"
          cat ${{ env.BASELINE_PATH }}

      - name: Cleanup build dir
        if: always()
        run: rm -rf ${{ env.BUILD_DIR }}
