name: LLVM test suite
run-name: "LLVM test suite ${{ inputs.pr_number && format('PR #{0} @{1}', inputs.pr_number, inputs.pr_sha) || 'nightly' }}"

on:
  workflow_run:
    workflows: [Nightly check]
    types: [completed]
  workflow_call:
    inputs:
      pr_number:
        description: "Pull request number used to scope the test-suite artifact"
        required: false
        type: string
        default: ""
      pr_sha:
        description: "Exact PR head SHA"
        required: false
        type: string
        default: ""
      toolset_run_id:
        description: "Workflow run containing the PR ELD toolset artifact"
        required: false
        type: string
        default: ""
      toolset_artifact:
        description: "PR ELD toolset artifact name"
        required: false
        type: string
        default: ""
      toolset_tarball:
        description: "Tar filename inside the PR toolset artifact"
        required: false
        type: string
        default: "install-pr-toolset.tar.xz"
  workflow_dispatch:

jobs:
  llvm-test-suite:
    if: |
      (github.repository == 'qualcomm/eld' &&
       ((github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success') ||
        github.event_name == 'workflow_dispatch')) ||
      github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ inputs.pr_sha && format('llvm-test-suite-pr-{0}-{1}', inputs.pr_number, inputs.pr_sha) || 'llvm-test-suite-nightly' }}
      cancel-in-progress: true
    permissions:
      contents: write
      actions: write
    env:
      ELD_SOURCE_DIR: ${{ github.workspace }}/llvm-project/llvm/tools/eld
    steps:
      - name: Checkout eld workflow sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: ${{ github.ref }}
          path: llvm-project/llvm/tools/eld

      - name: Configure workflow environment variables
        if: inputs.pr_sha == ''
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/ConfigureBuildWorkflowENV

      - name: Record pre-build entry
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/BuildStatusDataRecorder
        with:
          enabled: true
          project: "llvm-project/llvm/tools/eld"
          stage: "pre-"
          workflow-name: "llvm-test-suite"
          record-mode: "record"
          status: "fail"
          run-id: ${{ github.run_id }}
          arch-name: "x86_64"
          branch-name: "${{ env.BUILD_BRANCH }}"

      - name: Install dependencies
        run: |
          pip3 install lit
          if [ -n "${{ inputs.pr_sha }}" ]; then
            sudo apt-get update
            sudo apt-get install -y libunwind-18
          fi

      - name: Fetch nightly ELD
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/FetchNightlyToolset

      - name: Preserve nightly compiler runtimes
        if: inputs.pr_sha != ''
        run: |
          mkdir -p nightly-cxx-runtime
          find "${GITHUB_WORKSPACE}/inst/lib" -maxdepth 1 \( \
            -name 'libc++.so*' -o -name 'libc++abi.so*' \
          \) -exec cp -a {} nightly-cxx-runtime/ \;

      - name: Overlay PR ELD toolset
        if: inputs.pr_sha != ''
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/FetchEldToolset
        with:
          run-id: ${{ inputs.toolset_run_id }}
          artifact-name: ${{ inputs.toolset_artifact }}
          tarball: ${{ inputs.toolset_tarball }}

      - name: Restore nightly compiler runtimes
        if: inputs.pr_sha != ''
        run: |
          cp -a nightly-cxx-runtime/. "${GITHUB_WORKSPACE}/inst/lib/"

      - name: Configure nightly toolchain library path
        if: inputs.pr_sha != ''
        run: |
          echo "LD_LIBRARY_PATH=${GITHUB_WORKSPACE}/inst/lib:${GITHUB_WORKSPACE}/inst/lib/x86_64-unknown-linux-gnu:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Diagnose LLVM toolchain
        shell: bash
        run: |
          set +e
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          echo "clang: $(command -v clang)"
          echo "clang++: $(command -v clang++)"
          clang --version
          clang++ --version
          ldd "$(command -v clang)" | grep -E 'libc\\+\\+|libcxxabi|unwind|not found' || true
          ldd "$(command -v clang++)" | grep -E 'libc\\+\\+|libcxxabi|unwind|not found' || true

      - name: Clone LLVM test suite
        run: git clone --depth 1 https://github.com/llvm/llvm-test-suite.git

      - name: Configure test suite
        run: |
          ELD_BIN=$(which ld.eld)
          LIB_DIR="$(dirname "$ELD_BIN")/../lib"
          RT_LIB_DIR="$LIB_DIR/x86_64-unknown-linux-gnu"
          # TEST_SUITE_SUBDIRS is left unset, so llvm-test-suite/CMakeLists.txt
          # runs its own auto-discovery.
          # That resolves to:
          #   Bitcode;External;MicroBenchmarks;MultiSource;SingleSource;tools/test
          #
          # What runs:
          #   - Bitcode: runs. Needs -DELD_ENABLE_SYMBOL_VERSIONING=ON, which the
          #     fetched nightly toolchain is built with.
          #   - MicroBenchmarks, MultiSource, SingleSource, tools/test: run.
          #
          # What is discovered but contributes nothing on this runner:
          #   - External: configures, but every benchmark under it is gated on
          #     its own TEST_SUITE_<NAME>_ROOT pointing at licensed/proprietary
          #     sources (e.g. TEST_SUITE_SPEC2000_ROOT) that are not supplied
          #     here, so none of it builds.
          #
          # What auto-discovery drops before we ever see it:
          #   - CTMark: removed by the suite itself; it is just symlinks into
          #     MultiSource, so keeping it would double-build those tests.
          #   - Fortran: removed because TEST_SUITE_FORTRAN defaults OFF unless
          #     Fortran is already in TEST_SUITE_SUBDIRS, which it isn't since
          #     we leave that variable unset.
          #   - litsupport, tools: removed; these are the lit harness and its
          #     support utilities, not tests (tools/test is added back above).
          #
          # Not part of the CMake-driven build:
          #   ABI-Testsuite, ClangAnalyzer, LNTBased, litsupport-tests,
          #   test-suite-externals, utils.
          cmake -G Ninja \
            -S llvm-test-suite \
            -B build-llvm-test-suite \
            -DCMAKE_C_COMPILER=$(which clang) \
            -DCMAKE_CXX_COMPILER=$(which clang++) \
            -DCMAKE_C_FLAGS="--ld-path=$ELD_BIN" \
            -DCMAKE_CXX_FLAGS="--ld-path=$ELD_BIN -stdlib=libc++" \
            -DCMAKE_EXE_LINKER_FLAGS="--ld-path=$ELD_BIN -stdlib=libc++ -Wl,-rpath,$LIB_DIR -Wl,-rpath,$RT_LIB_DIR" \
            -DTEST_SUITE_RUN_TYPE=nightly

      - name: Build test suite
        run: ninja -C build-llvm-test-suite -j$(nproc) -k 0

      - name: Run tests
        run: |
          set -o pipefail
          lit -j$(nproc) build-llvm-test-suite 2>&1 | tee test-output.txt

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: llvm-test-suite-results${{ inputs.pr_sha && format('-{0}', inputs.pr_sha) || '' }}
          path: test-output.txt
          retention-days: 7

      - name: Update build entry
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/BuildStatusDataRecorder
        with:
          enabled: true
          project: "llvm-project/llvm/tools/eld"
          stage: "post-"
          workflow-name: "llvm-test-suite"
          record-mode: "update"
          status: "pass"
          run-id: ${{ github.run_id }}
          arch-name: "x86_64"
          branch-name: "${{ env.BUILD_BRANCH }}"

      - name: Delete older LLVM test-suite results
        if: success() && inputs.pr_sha == ''
        continue-on-error: true
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/DeleteOldArtifacts
        with:
          artifact-names: llvm-test-suite-results
          workflow-id: llvm-test-suite.yml
