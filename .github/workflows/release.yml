name: Release
owner: quic-areg

# TODO:
# This is a template workflow to test release notes via manual dispatch. This
# must be updated for an official release.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / version to use for the test release (e.g. v23.0.0)'
        required: false
        default: 'v23.0.0'
      draft:
        description: 'Publish as draft?'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      prerelease:
        description: 'Is it a prerelease?'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      previous_tag_name:
        description: 'Tag to start release notes from'
        required: false
        default: 'v22.1.0-rc3'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout with full history so GitHub can compare against the
      #    previous tag when generating the PR/commit list
      # ------------------------------------------------------------------ #
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------ #
      # 2. Generate release notes against the explicitly selected tag
      # ------------------------------------------------------------------ #
      - name: Generate release notes
        id: release_notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag_name }}
          PREVIOUS_TAG_NAME: ${{ github.event.inputs.previous_tag_name }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${TAG_NAME}" \
            -f target_commitish="${GITHUB_SHA}" \
            -f previous_tag_name="${PREVIOUS_TAG_NAME}" > /tmp/release-notes.json

          {
            echo 'body<<RELEASE_NOTES_EOF'
            jq -r '.body' /tmp/release-notes.json
            echo 'RELEASE_NOTES_EOF'
          } >> "${GITHUB_OUTPUT}"

      # ------------------------------------------------------------------ #
      # 3. Create the GitHub Release
      # ------------------------------------------------------------------ #
      - name: Create Release
        uses: ./.github/workflows/release
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          release_name: 'ELD ${{ github.event.inputs.tag_name }}'
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: 'false'
          body: ${{ steps.release_notes.outputs.body }}
