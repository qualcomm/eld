name: Benchmark PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read
  actions: write

concurrency:
  group: benchmark-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: ELD linker performance benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: eld

      - name: Read LLVM version
        run: |
          LLVM_VER=$(cat eld/utils/benchmark/llvm-version.txt | tr -d '[:space:]')
          echo "LLVM_VER=$LLVM_VER" >> $GITHUB_ENV

      - name: Install LLVM from apt
        run: |
          sudo install -d -m 0755 /usr/share/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/llvm-archive-keyring.gpg >/dev/null
          CODENAME=$(. /etc/os-release && echo $VERSION_CODENAME)
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] \
            https://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-${LLVM_VER} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update -q
          sudo apt-get install -y llvm-${LLVM_VER}-dev clang-${LLVM_VER} \
            ninja-build cmake time
          echo "LLVM_DIR=/usr/lib/llvm-${LLVM_VER}/lib/cmake/llvm" >> $GITHUB_ENV

      - name: Cache reproducers
        id: cache-reproducers
        uses: actions/cache@v4
        with:
          path: reproducers
          key: lld-speed-test-llvm${{ env.LLVM_VER }}-${{ hashFiles('eld/utils/benchmark/workloads.txt') }}

      - name: Collect reproducers
        if: steps.cache-reproducers.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/llvm/llvm-project.git llvm-src
          cd llvm-src
          git sparse-checkout set lld/utils/speed-test-reproducers
          mv lld/utils/speed-test-reproducers ../reproducers

      - name: Build ELD (PR branch)
        run: |
          sudo apt-get install -y libc++-${LLVM_VER}-dev libc++abi-${LLVM_VER}-dev lld-${LLVM_VER}
          cmake -G Ninja \
            -S "$GITHUB_WORKSPACE/eld" \
            -B build \
            -DELD_USE_EXTERNAL_LLVM=ON \
            -DLLVM_DIR="$LLVM_DIR" \
            "-DLLVM_TABLEGEN_EXE=/usr/lib/llvm-${LLVM_VER}/bin/llvm-tblgen" \
            -DELD_TARGETS_TO_BUILD="Hexagon;AArch64;ARM;RISCV;X86" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-${LLVM_VER} \
            -DCMAKE_CXX_COMPILER=clang++-${LLVM_VER} \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DLLVM_ENABLE_LLD=ON
          cmake --build build --target ld.eld -j$(nproc)

      - name: Filter workloads
        run: |
          mkdir reproducers-filtered
          WORKLOADS=$(grep -v '^\s*#' eld/utils/benchmark/workloads.txt | xargs)
          for wl in $WORKLOADS; do
            [ -d "reproducers/$wl" ] && ln -s "$PWD/reproducers/$wl" "reproducers-filtered/$wl"
          done

      - name: Run benchmark (PR branch)
        run: |
          bash eld/utils/benchmark/run_benchmark.sh \
            --eld build/bin/ld.eld \
            --reproducers reproducers-filtered \
            > results-pr.json

      - name: Download baseline artifact
        id: download-baseline
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: benchmark-baseline.yml
          branch: main
          name: benchmark-baseline
          path: .
        continue-on-error: true

      - name: Compare and post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Warn if workloads.txt changed in this PR — different workloads = baseline not comparable
          NOTICE=""
          if ! git -C eld diff --quiet origin/main...HEAD -- utils/benchmark/workloads.txt; then
            NOTICE="> ⚠️ **workloads.txt changed in this PR** — baseline results used different workloads and are not directly comparable. A new baseline will be established after merge."
          fi

          REGRESSION=0
          if [ -f baseline.json ]; then
            python3 eld/utils/benchmark/compare_results.py \
              --pr results-pr.json \
              --baseline baseline.json \
              --threshold 15 \
              > comment.md || REGRESSION=$?
          else
            python3 eld/utils/benchmark/compare_results.py \
              --pr results-pr.json \
              --threshold 15 \
              > comment.md || REGRESSION=$?
          fi

          # Prepend LLVM version notice if present
          if [ -n "$NOTICE" ]; then
            echo -e "${NOTICE}\n\n$(cat comment.md)" > comment.md
          fi

          # Always append which LLVM version was used
          echo "" >> comment.md
          echo "_Benchmarked with LLVM ${LLVM_VER}_" >> comment.md

          gh pr comment "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file comment.md \
            --edit-last || \
          gh pr comment "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file comment.md

          exit $REGRESSION
