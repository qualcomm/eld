name: Benchmark PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read
  actions: read

jobs:
  benchmark:
    name: ELD linker performance benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build clang time python3

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: eld

      - name: Checkout LLVM
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: main
          path: llvm-project
          fetch-depth: 1

      - name: Build ELD (PR branch)
        run: |
          cmake -G Ninja \
            -S llvm-project/llvm \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_ENABLE_PROJECTS="" \
            -DLLVM_EXTERNAL_PROJECTS=eld \
            -DLLVM_EXTERNAL_ELD_SOURCE_DIR=${{ github.workspace }}/eld \
            -DLLVM_TARGETS_TO_BUILD="AArch64;ARM;Hexagon;RISCV;X86"
          cmake --build build --target ld.eld -j$(nproc)

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Collect reproducers
        run: nix-build eld/utils/benchmark/collect.nix -o reproducers

      - name: Run benchmark (PR branch)
        run: |
          bash eld/utils/benchmark/run_benchmark.sh \
            --eld build/bin/ld.eld \
            --reproducers reproducers \
            > results-pr.json

      - name: Download baseline artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: benchmark-baseline.yml
          branch: main
          name: benchmark-baseline
          path: .

      - name: Compare and post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 eld/utils/benchmark/compare_results.py \
            --pr results-pr.json \
            --baseline baseline.json \
            --threshold 5 \
            > comment.md

          gh pr comment "$PR_NUMBER" \
            --repo ${{ github.repository }} \
            --body-file comment.md \
            --edit-last || \
          gh pr comment "$PR_NUMBER" \
            --repo ${{ github.repository }} \
            --body-file comment.md
