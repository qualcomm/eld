name: Release 23.x nightly check
# owner: quic-seaswara

on:
  schedule:
    - cron: '0 7 * * *'  # Runs daily at 1:00 AM CST
  workflow_dispatch: {}


permissions:
  actions: write
  contents: read
jobs:
  build-and-runtest-release-23x:
    if: github.repository == 'qualcomm/eld'
    runs-on: ubuntu-latest
    env:
      SCRIPTS_DIR: ${{ github.workspace }}/llvm-project/llvm/tools/eld/.github/workflows/scripts

    steps:
      - name: Configure LLVM 23 apt repository
        run: |
          sudo install -d -m 0755 /usr/share/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/llvm-archive-keyring.gpg >/dev/null
          UBUNTU_CODENAME="$(. /etc/os-release && echo "${VERSION_CODENAME}")"
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/${UBUNTU_CODENAME}/ llvm-toolchain-${UBUNTU_CODENAME}-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-23.list >/dev/null

      - name: Install libc++ and libc++abi
        id: install_dependencies
        run: |
          sudo apt update
          sudo apt install -y clang-23 lld-23 ninja-build libc++-23-dev libc++abi-23-dev libclang-rt-23-dev libunwind-23-dev
          printf 'PATH=/usr/lib/llvm-23/bin:%s\nLD_LIBRARY_PATH=/usr/lib/llvm-23/lib:%s\n' \
            "$PATH" "$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Build and Test with Clang and show versions
        run: |
          echo "clang version"
          clang --version
          echo "clang++ version"
          clang++ -stdlib=libc++ --version
          echo "ld.lld version"
          ld.lld --version
          echo '#include <iostream>' > test.cpp
          echo 'int main() { std::cout << "Hello, Clang on Ubuntu latest!" << std::endl; return 0; }' >> test.cpp
          clang++ -std=c++17 -stdlib=libc++ test.cpp -o test_clang
          ./test_clang

      - name: CPU and Memory information
        run: |
          echo "Number of CPUs:"
          nproc --all # or grep -c ^processor /proc/cpuinfo
          echo "Memory information:"
          free -h # or cat /proc/meminfo

      # Scheduled workflows run from the default branch, so pin both checkouts
      # to the release branch explicitly.
      - name: Checkout llvm-project release/23.x
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llvm/llvm-project
          path: llvm-project
          ref: release/23.x

      - name: Checkout ELD release/23.x
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: llvm-project/llvm/tools/eld
          repository: ${{ github.repository }}
          ref: release/23.x
          fetch-depth: 0

      - name: Run CMake
        run: |
          mkdir -p obj
          cd obj
          cat > distribution-components.cmake <<'EOF'
          set(LLVM_INSTALL_TOOLCHAIN_ONLY ON CACHE BOOL "")
          set(LLVM_TOOLCHAIN_TOOLS
            llvm-ar
            llvm-cov
            llvm-cxxfilt
            llvm-dis
            llvm-dlltool
            llvm-dwp
            llvm-lib
            llvm-mca
            llvm-nm
            llvm-objcopy
            llvm-objdump
            llvm-pdbutil
            llvm-profdata
            llvm-profgen
            llvm-ranlib
            llvm-readobj
            llvm-readelf
            llvm-mc
            llvm-as
            llvm-remarkutil
            llvm-size
            llvm-strings
            llvm-strip
            llvm-symbolizer
            opt
            CACHE STRING "")
          set(LLVM_DISTRIBUTION_COMPONENTS
            clang
            lld
            LTO
            clang-resource-headers
            clang-format
            clang-tidy
            clangd
            builtins
            runtimes
            ${LLVM_TOOLCHAIN_TOOLS}
            ld.eld
            CACHE STRING "")
          EOF
          cmake -G Ninja \
            -C distribution-components.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
            -DLLVM_ENABLE_PROJECTS="llvm;clang;clang-tools-extra;lld" \
            -DCLANG_ENABLE_CIR=OFF \
            -DLLVM_ENABLE_RUNTIMES="compiler-rt;libcxx;libcxxabi;libunwind" \
            -DCMAKE_C_COMPILER:STRING="$(command -v clang)" \
            -DCMAKE_CXX_COMPILER:STRING="$(command -v clang++)" \
            -DCMAKE_CXX_FLAGS:STRING="-stdlib=libc++" \
            -DCMAKE_INSTALL_RPATH:STRING="\$ORIGIN/../lib/" \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH:BOOL=ON \
            -DLLVM_TARGETS_TO_BUILD:STRING="ARM;AArch64;RISCV;Hexagon;X86" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install-release-23.x-toolchain" \
            -DLLVM_ENABLE_SPHINX=OFF \
            -DELD_ENABLE_SYMBOL_VERSIONING=ON \
            -DLLVM_INSTALL_UTILS=On \
            ../llvm-project/llvm

      - name: Build and install toolchain
        id: build_toolchain
        run: |
          cd obj
          ninja -j11 install-distribution

      - name: Install testing utilities into toolchain
        shell: bash
        run: |
          set -euo pipefail
          BUILD_BIN_DIR="${{ github.workspace }}/obj/bin"
          INSTALL_BIN_DIR="${{ github.workspace }}/install-release-23.x-toolchain/bin"
          mkdir -p "${INSTALL_BIN_DIR}"

          testing_utils=(
            FileCheck
            split-file
            count
            yaml2obj
            obj2yaml
            not
          )

          echo "Building testing utilities with ninja"
          ninja -C "${{ github.workspace }}/obj" -j11 "${testing_utils[@]}"

          echo "Installing testing utilities into ${INSTALL_BIN_DIR}"
          for util in "${testing_utils[@]}"; do
            if [[ -x "${BUILD_BIN_DIR}/${util}" ]]; then
              echo "  - ${util}"
              cp "${BUILD_BIN_DIR}/${util}" "${INSTALL_BIN_DIR}/"
            else
              echo "Warning: testing utility ${util} not found in ${BUILD_BIN_DIR}" >&2
            fi
          done

      - name: Bundle binary shared library dependencies
        shell: bash
        run: |
          bash "${SCRIPTS_DIR}/BundleSharedLibDeps.sh" \
            "${{ github.workspace }}/install-release-23.x-toolchain" \
            clang clang++ ld.eld lld ld.lld clangd clang-tidy clang-format

          for tool in ld.eld clang; do
            BIN="${{ github.workspace }}/install-release-23.x-toolchain/bin/${tool}"
            if [[ -x "${BIN}" ]]; then
              echo "${tool} RPATH/RUNPATH:"
              readelf -d "${BIN}" | grep -E 'RPATH|RUNPATH' || true
            fi
          done

      - name: Pack toolchain tarball
        run: |
          tar -C ${{ github.workspace }}/ \
              -Jcvf install-release-23.x-toolchain.tar.xz install-release-23.x-toolchain

      - name: Upload release/23.x toolchain artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: install-release-23.x-toolchain.tar.xz
          path: install-release-23.x-toolchain.tar.xz
          # Keep a fallback copy in case the workflow fails before cleanup.
          retention-days: 7

      - name: Run ELD extended tests
        run: |
          cd obj
          ninja -j8 check-eld-extended

      - name: Summarize test results
        run: |
          cd obj
          ninja check-eld-summary

      - name: Delete older release/23.x toolchain artifacts
        continue-on-error: true
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/DeleteOldArtifacts
        with:
          artifact-names: install-release-23.x-toolchain.tar.xz
