name: DownloadLatestBusybox
description: Download the BusyBox binary artifact from the latest successful busybox.yml run

inputs:
  arch:
    description: "Target architecture matrix key (e.g. riscv32, x86_64)"
    required: true
  path:
    description: "Directory to download the busybox binary into"
    required: false
    default: "busybox-dl"

outputs:
  busybox_path:
    description: "Path to the downloaded busybox binary"
    value: ${{ steps.locate.outputs.busybox_path }}

runs:
  using: "composite"
  steps:
    - name: Resolve busybox.yml run id
      id: resolve
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
      with:
        github-token: ${{ github.token }}
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const workflowId = 'busybox.yml';
          const artifactName = 'busybox-eld-${{ inputs.arch }}';
          let selectedRun;

          for (let attempt = 1; attempt <= 5 && !selectedRun; attempt++) {
            const resp = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowId,
              branch: 'main',
              status: 'completed',
              per_page: 100,
              page: 1,
            });

            const successfulRuns = (resp.data.workflow_runs || [])
              .filter(run => run.conclusion === 'success')
              .sort((a, b) => b.run_number - a.run_number);

            for (const run of successfulRuns) {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                { owner, repo, run_id: run.id, per_page: 100 }
              );
              const artifact = artifacts.find(
                candidate => candidate.name === artifactName && !candidate.expired
              );
              if (artifact) {
                selectedRun = run;
                break;
              }
            }

            if (!selectedRun && attempt < 5) {
              core.info(`No usable successful busybox run found on attempt ${attempt}; retrying.`);
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
          }

          if (!selectedRun) {
            core.setFailed(`No successful ${workflowId} run on main contains artifact "${artifactName}".`);
            return;
          }

          core.info(`Using busybox run id: ${selectedRun.id}, run_number: ${selectedRun.run_number}, branch: ${selectedRun.head_branch}`);
          core.setOutput('run_id', String(selectedRun.id));

    - name: Download BusyBox binary
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
      with:
        name: busybox-eld-${{ inputs.arch }}
        run-id: ${{ steps.resolve.outputs.run_id }}
        github-token: ${{ github.token }}
        path: ${{ inputs.path }}

    - name: Locate downloaded binary
      id: locate
      shell: bash
      env:
        BUSYBOX_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        echo "busybox_path=${BUSYBOX_PATH}/busybox" >> "${GITHUB_OUTPUT}"
