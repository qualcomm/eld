name: Memory with origins sanitizer
# owner: Steven6798

on:
  # workflow_run:
  #   workflows: [Nightly check]
  #   types: [completed]
  workflow_dispatch:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull request number"
        required: false
        type: string
        default: ""
      pr_sha:
        description: "Exact pull request head SHA"
        required: false
        type: string
        default: ""


permissions:
  contents: write
  actions: write
jobs:
  msan-origins:
    runs-on: ubuntu-latest
    if: |
      github.repository == 'qualcomm/eld' &&
       ((github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success') ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'workflow_call' ||
        inputs.pr_sha != '')

    steps:
      - name: Set up Clang 22
        uses: egor-tensin/setup-clang@23bc15cd4207e45f1566447deb48f4ff3ef932cb #v2.3
        with:
          version: "22"
          platform: x64

      - name: Install libc++ and libc++abi
        id: install_dependencies
        run: |
          sudo apt update
          sudo apt install -y clang-22 lld-22 ninja-build zlib1g-dev libc++-22-dev libc++abi-22-dev ccache libclang-rt-22-dev libunwind-22-dev
          echo "PATH=/usr/lib/llvm-22/bin:$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/lib/llvm-22/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Build and Test with Clang and show versions
        run: |
          echo "clang version"
          clang --version
          echo "clang++ version"
          clang++ -stdlib=libc++ --version
          echo "ld.lld version"
          ld.lld --version
          echo '#include <iostream>' > test.cpp
          echo 'int main() { std::cout << "Hello, Clang on Ubuntu 24.04!" << std::endl; return 0; }' >> test.cpp
          clang++ -std=c++17 -stdlib=libc++ test.cpp -o test_clang
          ./test_clang

      - name: Checkout llvm-project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llvm/llvm-project
          path: ./llvm-project/
          ref: main

      - name: Checkout eld
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qualcomm/eld
          path: ./llvm-project/llvm/tools/eld
          ref: ${{ inputs.pr_sha || github.ref_name }}
          fetch-depth: 1

      - name: Configure workflow environment variables
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/ConfigureBuildWorkflowENV

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ${{ github.workspace }}/obj/ccache
          key: sanitize-memory-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sanitize-memory-ccache-${{ runner.os }}-

      - name: Record pre-build entry
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/BuildStatusDataRecorder
        with:
          enabled: true
          project: "./llvm-project/llvm/tools/eld"
          stage: "pre-"
          workflow-name: "memory-with-origins-sanitizer"
          record-mode: "record"
          status: "fail"
          run-id: ${{github.run_id}}
          arch-name: "all"
          branch-name: "${{env.BUILD_BRANCH}}"

      - name: Build MSan-instrumented libc++ and libc++abi
        id: build_msan_libcxx
        run: |
          cmake -G Ninja \
            -S ./llvm-project/runtimes \
            -B ./msan-libcxx-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER:STRING=`which clang` \
            -DCMAKE_CXX_COMPILER:STRING=`which clang++` \
            -DLLVM_ENABLE_RUNTIMES="libcxxabi;libcxx" \
            -DLLVM_USE_SANITIZER="MemoryWithOrigins" \
            -DLIBCXX_ENABLE_SHARED=ON \
            -DLIBCXXABI_ENABLE_SHARED=ON \
            -DLIBCXX_INCLUDE_TESTS=OFF \
            -DLIBCXXABI_INCLUDE_TESTS=OFF \
            -DLIBUNWIND_INCLUDE_TESTS=OFF \
            -DLIBCXX_USE_COMPILER_RT=ON \
            -DLIBCXXABI_USE_COMPILER_RT=ON \
            -DLIBCXXABI_USE_LLVM_UNWINDER=OFF \
            -DCMAKE_INSTALL_PREFIX:PATH=${{ github.workspace }}/msan-libcxx
          ninja -C ./msan-libcxx-build cxxabi cxx
          ninja -C ./msan-libcxx-build install-cxxabi install-cxx
          echo "MSAN_LIBCXX=${{ github.workspace }}/msan-libcxx" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${{ github.workspace }}/msan-libcxx/lib:/usr/lib/llvm-22/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Run CMake
        run: |
          mkdir -p obj
          cd obj
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
            -DLLVM_USE_SANITIZER="MemoryWithOrigins" \
            -DLLVM_ENABLE_ZLIB:STRING=FORCE_ON \
            -DCMAKE_C_FLAGS:STRING="-fsanitize=memory -fsanitize-memory-track-origins=2" \
            -DCMAKE_CXX_FLAGS:STRING="-fsanitize=memory -fsanitize-memory-track-origins=2 -nostdinc++ -isystem $MSAN_LIBCXX/include/c++/v1" \
            -DCMAKE_EXE_LINKER_FLAGS:STRING="-fsanitize=memory -fsanitize-memory-track-origins=2 -stdlib=libc++ -L$MSAN_LIBCXX/lib -Wl,-rpath,$MSAN_LIBCXX/lib -Wl,--disable-new-dtags" \
            -DCMAKE_SHARED_LINKER_FLAGS:STRING="-fsanitize=memory -fsanitize-memory-track-origins=2 -stdlib=libc++ -L$MSAN_LIBCXX/lib -Wl,-rpath,$MSAN_LIBCXX/lib" \
            -DCMAKE_C_COMPILER:STRING=`which clang` \
            -DCMAKE_CXX_COMPILER:STRING=`which clang++` \
            -DLLVM_ENABLE_PROJECTS:STRING="clang" \
            -DCLANG_ENABLE_CIR=OFF \
            -DLLVM_TARGETS_TO_BUILD:STRING="ARM;AArch64;RISCV;Hexagon;X86" \
            -DLLVM_CCACHE_BUILD:BOOL=ON \
            -DLLVM_CCACHE_DIR:STRING=$PWD/ccache/ \
            -DLLVM_OPTIMIZED_TABLEGEN:BOOL=ON \
            -DLLVM_ENABLE_SPHINX=OFF \
            -DUSE_LLVM_UTILS_FROM_INSTALL:BOOL=ON \
            -DLLVM_USE_LINKER=lld \
            ../llvm-project/llvm

      - name: Build MSan test tools
        id: build_msan_tools
        run: |
          cd obj
          ninja ld.eld LSParserVerifier llvm-config

      - name: Prune ccache before save
        if: always() &&
          steps.build_msan_libcxx.outcome == 'success' &&
          steps.build_msan_tools.outcome == 'success'
        env:
          CCACHE_DIR: ${{ github.workspace }}/obj/ccache
        run: ccache --evict-older-than 7200s

      - name: Save ccache
        if: always() &&
          steps.build_msan_libcxx.outcome == 'success' &&
          steps.build_msan_tools.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ${{ github.workspace }}/obj/ccache
          key: sanitize-memory-ccache-${{ runner.os }}-${{ github.run_id }}

      - name: Delete old ccache entries
        if: always() &&
          steps.build_msan_libcxx.outcome == 'success' &&
          steps.build_msan_tools.outcome == 'success'
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/DeleteOldCaches
        with:
          cache-key-prefixes: sanitize-memory-ccache-${{ runner.os }}-

      - name: Fetch nightly toolset utilities
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/FetchNightlyToolset

      - name: Configure non-MSan test tools
        run: |
          test_tools_dir="${{ github.workspace }}/eld-test-tools"
          nightly_bin="${{ github.workspace }}/inst/bin"
          nightly_lib="${{ github.workspace }}/inst/lib"
          mkdir -p "$test_tools_dir"

          # Lit adds the configured LLVM library directory to child process
          # environments. Keep nightly tools isolated from the MSan libraries.
          for nightly_tool in "$nightly_bin"/*; do
            [ -x "$nightly_tool" ] || continue
            tool="${nightly_tool##*/}"
            if [ "$tool" = ld.eld ] || [ "$tool" = llvm-config ] || [ "$tool" = not ]; then
              continue
            fi
            cat > "$test_tools_dir/$tool" <<EOF
          #!/bin/sh
          exec env LD_LIBRARY_PATH="$nightly_lib" "$nightly_bin/$tool" "\$@"
          EOF
            chmod +x "$test_tools_dir/$tool"
          done

          # not launches a child process, so ensure its child uses the
          # appropriate library set instead of inheriting nightly libraries.
          cat > "$test_tools_dir/not" <<EOF
          #!/bin/sh
          child_ld="$nightly_lib"
          for arg in "\$@"; do
            case "\$arg" in
              -*) continue ;;
              */ld.eld|*/LSParserVerifier|*/llvm-config)
                child_ld="${{ github.workspace }}/obj/lib:${{ github.workspace }}/msan-libcxx/lib:$nightly_lib" ;;
            esac
            break
          done
          exec env LD_LIBRARY_PATH="$nightly_lib" "$nightly_bin/not" env LD_LIBRARY_PATH="\$child_ld" "\$@"
          EOF
          chmod +x "$test_tools_dir/not"

          # The three MSan tools are built explicitly above and must remain
          # available to Lit from the build tree.
          ln -sfn "${{ github.workspace }}/obj/bin/ld.eld" "$test_tools_dir/ld.eld"
          ln -sfn "${{ github.workspace }}/obj/bin/LSParserVerifier" "$test_tools_dir/LSParserVerifier"
          ln -sfn "${{ github.workspace }}/obj/bin/llvm-config" "$test_tools_dir/llvm-config"

          # The repository template remains unchanged; redirect this generated
          # test configuration only for the sanitizer workflow.
          lit_cfg_root="${{ github.workspace }}/obj/tools/eld/test"
          found_lit_cfg=0
          while IFS= read -r -d '' lit_site_cfg; do
            sed -i "s|^config.llvm_tools_dir = .*|config.llvm_tools_dir = \"$test_tools_dir\"|" "$lit_site_cfg"
            sed -i "s|^config.llvm_libs_dir = .*|config.llvm_libs_dir = \"${{ github.workspace }}/obj/lib\"|" "$lit_site_cfg"
            found_lit_cfg=1
          done < <(find "$lit_cfg_root" -type f -name lit.site.cfg -print0)
          test "$found_lit_cfg" -eq 1

      - name: Run tests
        run: |
          cd obj
          ninja -k 0 check-eld

      - name: Update build entry
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        uses: ./llvm-project/llvm/tools/eld/.github/workflows/BuildStatusDataRecorder
        with:
          enabled: true
          project: "./llvm-project/llvm/tools/eld"
          stage: "post-"
          workflow-name: "memory-with-origins-sanitizer"
          record-mode: "update"
          status: "pass"
          run-id: ${{github.run_id}}
          arch-name: "all"
          branch-name: "${{env.BUILD_BRANCH}}"
