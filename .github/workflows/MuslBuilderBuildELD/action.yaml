name: Build eld
description: Install dependencies and build eld
runs:
  using: "composite"
  steps:
    - name: Configure LLVM 23 apt repository
      shell: bash
      run: |
        sudo install -d -m 0755 /usr/share/keyrings
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
          | gpg --dearmor \
          | sudo tee /usr/share/keyrings/llvm-archive-keyring.gpg >/dev/null
        UBUNTU_CODENAME="$(. /etc/os-release && echo "${VERSION_CODENAME}")"
        echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/${UBUNTU_CODENAME}/ llvm-toolchain-${UBUNTU_CODENAME}-23 main" \
          | sudo tee /etc/apt/sources.list.d/llvm-23.list >/dev/null

    - name: Install dependencies
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y libc++-23-dev libc++abi-23-dev ccache \
          libclang-rt-23-dev cmake ninja-build make qemu-user
        echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"

    - name: Verify clang installation
      shell: bash
      run: |
        clang --version
        clang++ --version

    - name: Configure eld
      shell: bash
      run: |
        mkdir -p obj
        cd obj
        cmake -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=$PWD/../inst \
          -DLLVM_ENABLE_PROJECTS="llvm;clang;compiler-rt" \
          -DCLANG_ENABLE_CIR=OFF \
          -DCMAKE_C_COMPILER=`which clang` \
          -DCMAKE_CXX_COMPILER=`which clang++` \
          -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
          -DLLVM_TARGETS_TO_BUILD="ARM;AArch64;RISCV;Hexagon;X86" \
          -DELD_TARGETS_TO_BUILD='ARM;AArch64;RISCV;Hexagon;x86_64' \
          ../llvm-project/llvm

    - name: Build eld
      shell: bash
      run: | # zizmor: ignore[github-env] literal $(pwd)-derived path, not attacker-controlled
        cd obj
        ninja ld.eld FileCheck
        echo "$(pwd)/bin" >> "$GITHUB_PATH"
