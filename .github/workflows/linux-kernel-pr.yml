name: Linux Kernel Boot on ELD PR
# owner: Steven6798

# Reusable PR Linux kernel boot workflow. The PR comment router supplies the
# exact CI run and SHA-specific ELD toolset artifact.

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull request number used to scope kernel artifacts"
        required: true
        type: string
      pr_sha:
        description: "Exact pull request head SHA"
        required: true
        type: string
      toolset_run_id:
        description: "CI workflow run containing the PR ELD toolset artifact"
        required: true
        type: string
      toolset_artifact:
        description: "SHA-specific PR ELD toolset artifact name"
        required: true
        type: string
      linker_flags:
        description: "Additional linker flags to pass to ld.eld"
        required: false
        type: string
        default: ""

concurrency:
  group: linux-kernel-pr-${{ inputs.pr_number }}-${{ inputs.pr_sha }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  kernel:
    if: github.repository == 'qualcomm/eld'
    permissions:
      contents: write # BuildStatusDataRecorder pushes to the dashboard branch
      actions: write # list/download artifacts and remove superseded kernel artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv32
            target_triple: riscv32-unknown-linux-musl
            kbuild_arch: riscv
            defconfig: rv32_defconfig
            kernel_image: arch/riscv/boot/Image
            qemu_bin: qemu-system-riscv32
            qemu_machine: virt
            qemu_cpu: ""
            qemu_bios: /usr/lib/riscv32-linux-gnu/opensbi/generic/fw_dynamic.bin
            console_device: ttyS0
            enabled: 1
          - arch: riscv64
            target_triple: riscv64-unknown-linux-musl
            kbuild_arch: riscv
            defconfig: defconfig
            kernel_image: arch/riscv/boot/Image
            qemu_bin: qemu-system-riscv64
            qemu_machine: virt
            qemu_cpu: ""
            qemu_bios: ""
            console_device: ttyS0
            enabled: 1
          - arch: x86_64
            target_triple: x86_64-unknown-linux-musl
            kbuild_arch: x86_64
            defconfig: x86_64_defconfig
            kernel_image: arch/x86/boot/bzImage
            qemu_bin: qemu-system-x86_64
            qemu_machine: pc
            qemu_cpu: ""
            qemu_bios: ""
            console_device: ttyS0
            enabled: 0
          - arch: arm
            target_triple: arm-unknown-linux-musleabi
            kbuild_arch: arm
            defconfig: multi_v7_defconfig
            kernel_image: arch/arm/boot/zImage
            qemu_bin: qemu-system-arm
            qemu_machine: virt
            qemu_cpu: ""
            qemu_bios: ""
            console_device: ttyAMA0
            enabled: 1
          - arch: aarch64
            target_triple: aarch64-unknown-linux-musl
            kbuild_arch: arm64
            defconfig: defconfig
            kernel_image: arch/arm64/boot/Image
            qemu_bin: qemu-system-aarch64
            qemu_machine: virt
            qemu_cpu: cortex-a57
            qemu_bios: ""
            console_device: ttyAMA0
            enabled: 1
    uses: ./.github/workflows/linux-kernel-run.yml
    with:
      arch: ${{ matrix.arch }}
      target_triple: ${{ matrix.target_triple }}
      kbuild_arch: ${{ matrix.kbuild_arch }}
      defconfig: ${{ matrix.defconfig }}
      kernel_image: ${{ matrix.kernel_image }}
      qemu_bin: ${{ matrix.qemu_bin }}
      qemu_machine: ${{ matrix.qemu_machine }}
      qemu_cpu: ${{ matrix.qemu_cpu }}
      qemu_bios: ${{ matrix.qemu_bios }}
      console_device: ${{ matrix.console_device }}
      enabled: ${{ matrix.enabled }}
      toolset_run_id: ${{ inputs.toolset_run_id }}
      toolset_artifact: ${{ inputs.toolset_artifact }}
      toolset_tarball: install-pr-toolset.tar.xz
      linker_flags: ${{ inputs.linker_flags }}
      artifact-workflow-id: linux-kernel-pr.yml
      artifact-pull-request-number: ${{ inputs.pr_number }}
      stable_llvm: true
