name: Windows Arm64/x86_64 CI/Nightly
# owner: Steven6798

on:
  schedule:
    # 9:00 PM Central
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      pr_sha:
        description: "Exact pull request head SHA to build"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      pr_number:
        description: "Pull request number"
        required: false
        type: string
        default: ""
      pr_sha:
        description: "Exact pull request head SHA"
        required: false
        type: string
        default: ""


permissions:
  contents: write
jobs:
  build-windows:
    if: |
      github.repository == 'qualcomm/eld' &&
       (github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'workflow_call' ||
        inputs.pr_sha != '')
    permissions:
      contents: write
    env:
      ELD_REF: ${{ inputs.pr_sha || github.ref_name }}
      CCACHE_DIR: ${{ github.workspace }}/ccache/main
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: true

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
            vs-arch: x64
            vs-host-arch: x64
            vs-tools: x86.x64
            name: Windows-x86_64

          - runner: windows-11-arm
            arch: ARM64
            vs-arch: arm64
            vs-host-arch: arm64
            vs-tools: ARM64
            name: Windows-Arm64

    steps:
      - name: Disable Microsoft Defender real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop

      - name: Map Git usr/bin to a space-free drive and prepend to PATH
        shell: pwsh
        run: |
          subst P: "C:\Program Files\Git\usr\bin"
          'P:\' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 #v7.1.0
        with:
          python-version: '3.14'

      - name: Report Python version
        shell: bash
        run: echo "::notice::Using Python $(python --version) from $(which python)"

      - name: Checkout llvm-project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llvm/llvm-project
          ref: main
          path: nightly/llvm-project

      - name: Checkout eld
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qualcomm/eld
          ref: ${{ env.ELD_REF }}
          path: nightly/llvm-project/llvm/tools/eld
          fetch-depth: 1

      - name: Record pre-build entry
        if: github.event_name == 'schedule'
        uses: ./nightly/llvm-project/llvm/tools/eld/.github/workflows/BuildStatusDataRecorder
        with:
          enabled: true
          project: "nightly/llvm-project/llvm/tools/eld"
          stage: "pre-"
          workflow-name: "windows"
          record-mode: "record"
          status: "fail"
          run-id: ${{github.run_id}}
          arch-name: ${{ matrix.arch }}
          branch-name: "${{ env.ELD_REF }}"

      - name: Install ccache and Ninja
        shell: pwsh
        run: |
          foreach ($tool in @('ccache', 'ninja')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              choco install $tool --no-progress --yes
              if ($LASTEXITCODE -ne 0) { throw "Failed to install $tool" }
            }
            & $tool --version
            if ($LASTEXITCODE -ne 0) { throw "Failed to run $tool" }
          }

      - name: Set up Visual Studio environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            $vswhere = "$env:ProgramFiles\Microsoft Visual Studio\Installer\vswhere.exe"
          }
          $vsInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.${{ matrix.vs-tools }} -property installationPath
          if (-not $vsInstall) { throw 'Visual Studio C++ tools not found' }
          $vsEnvironment = & cmd /c "`"$vsInstall\Common7\Tools\VsDevCmd.bat`" -arch=${{ matrix.vs-arch }} -host_arch=${{ matrix.vs-host-arch }} >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to initialize Visual Studio environment' }
          foreach ($entry in $vsEnvironment) {
            if ($entry -match '^([^=]+)=(.*)$') {
              if ([Environment]::GetEnvironmentVariable($Matches[1]) -ne $Matches[2]) {
                $entry | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }
          }

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: windows-eld-ccache-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: |
            windows-eld-ccache-${{ matrix.arch }}-

      - name: Configure CMake
        working-directory: nightly
        shell: bash
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --zero-stats
          ccache --set-config "max_size=0"
          ccache --show-config
          cmake -G Ninja -S llvm-project/llvm -B obj \
            -DCMAKE_C_COMPILER=cl \
            -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
            -DLLVM_ENABLE_PROJECTS="llvm;clang;clang-tools-extra" \
            -DCLANG_ENABLE_CIR=OFF \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_TARGETS_TO_BUILD="ARM;AArch64;RISCV;Hexagon;X86" \
            -DELD_TARGETS_TO_BUILD='ARM;AArch64;RISCV;Hexagon;X86;Template' \
            -DLLVM_CCACHE_BUILD:BOOL=ON \
            -DLLVM_CCACHE_DIR:STRING="$CCACHE_DIR"

      - name: Cache usage before build
        shell: pwsh
        run: ccache --show-stats --dir="$env:CCACHE_DIR"

      - name: Build
        working-directory: nightly/obj
        shell: bash
        run: cmake --build . --config Release

      - name: Install PyYAML
        shell: bash
        run: |
          echo "Installing dependencies using $(python --version) at $(which python)"
          python -m pip install pyyaml psutil

      - name: Run tests
        working-directory: nightly/obj
        shell: bash
        run: cmake --build . --config Release --target check-eld

      - name: Summarize test results
        working-directory: nightly/obj
        shell: bash
        run: cmake --build . --config Release --target check-eld-summary

      - name: Cache usage after build
        shell: pwsh
        run: ccache --show-stats --dir="$env:CCACHE_DIR"

      - name: Prune ccache before save
        shell: pwsh
        run: ccache --evict-older-than 7200s --dir="$env:CCACHE_DIR"

      - name: Save ccache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: windows-eld-ccache-${{ matrix.arch }}-${{ github.run_id }}

      - name: Update build entry
        if: github.event_name == 'schedule'
        uses: ./nightly/llvm-project/llvm/tools/eld/.github/workflows/BuildStatusDataRecorder
        with:
          enabled: true
          project: "nightly/llvm-project/llvm/tools/eld"
          stage: "post-"
          workflow-name: "windows"
          record-mode: "update"
          status: "pass"
          run-id: ${{github.run_id}}
          arch-name: ${{ matrix.arch }}
          branch-name: "${{ env.ELD_REF }}"

      - name: Clean up
        if: always()
        shell: bash
        run: rm -rf nightly
