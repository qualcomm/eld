name: Zephyr on ELD PR
# owner: quic-areg

# Reusable Zephyr PR workflow. The PR comment router supplies the exact CI run
# and SHA-specific ELD toolset artifact.

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull request number used to scope Zephyr artifacts"
        required: true
        type: string
      pr_sha:
        description: "Exact pull request head SHA"
        required: true
        type: string
      toolset_run_id:
        description: "CI workflow run containing the PR ELD toolset artifact"
        required: true
        type: string
      toolset_artifact:
        description: "SHA-specific PR ELD toolset artifact name"
        required: true
        type: string

# A newer run for the same PR supersedes the previous one.
concurrency:
  group: zephyr-pr-${{ inputs.pr_number }}-${{ inputs.pr_sha }}
  cancel-in-progress: true

jobs:
  zephyr:
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - { board: qemu_riscv32,     arch: riscv32,  extra_args: CONFIG_PICOLIBC_USE_TOOLCHAIN=y }
          - { board: qemu_riscv32_xip, arch: riscv32,  extra_args: CONFIG_PICOLIBC_USE_TOOLCHAIN=y }
          - { board: qemu_riscv64,     arch: riscv64,  extra_args: CONFIG_PICOLIBC_USE_TOOLCHAIN=y }
          - { board: qemu_cortex_m3,   arch: arm,      extra_args: CONFIG_PICOLIBC_USE_TOOLCHAIN=y }
          - { board: qemu_cortex_a53,  arch: aarch64,  extra_args: CONFIG_PICOLIBC_USE_TOOLCHAIN=y }
          - { board: qemu_x86_64,      arch: x86_64,   toolchain: zephyr-sdk, extra_args: "" }
    uses: ./.github/workflows/zephyr-run.yml
    with:
      board: ${{ matrix.target.board }}
      arch: ${{ matrix.target.arch }}
      toolchain: ${{ matrix.target.toolchain || 'cpullvm' }}
      extra_args: ${{ matrix.target.extra_args }}
      test_scope: tests/kernel
      toolset_run_id: ${{ inputs.toolset_run_id }}
      toolset_artifact: ${{ inputs.toolset_artifact }}
      toolset_tarball: install-pr-toolset.tar.xz
      artifact-workflow-id: zephyr-pr.yml
      artifact-pull-request-number: ${{ inputs.pr_number }}
