name: DownloadWorkflowArtifact
description: >
  Download a named artifact from an exact run or the latest successful run
  of a workflow, optionally extracting a tar archive and adding a directory
  to PATH.

inputs:
  workflow-id:
    description: "Workflow file name or ID to search when run-id is not provided"
    required: false
    default: ""
  run-id:
    description: "Exact workflow run ID to download from; skips latest-run lookup"
    required: false
    default: ""
  artifact-name:
    description: "Exact artifact name to download"
    required: true
  branch:
    description: "Branch to search for successful workflow runs"
    required: false
    default: "main"
  path:
    description: "Directory to download the artifact into"
    required: false
    default: "."
  extract-archive:
    description: "Extract the downloaded artifact as a tar archive"
    required: false
    default: "false"
  archive-file:
    description: "Tar filename inside the downloaded artifact; defaults to artifact-name"
    required: false
    default: ""
  extract-to:
    description: "Directory to extract the archive into"
    required: false
    default: "inst"
  strip-components:
    description: "Number of leading path components to strip from archive entries"
    required: false
    default: "0"
  add-to-path:
    description: "Optional directory to append to PATH after extraction"
    required: false
    default: ""

outputs:
  run_id:
    description: "ID of the workflow run containing the downloaded artifact"
    value: ${{ inputs.run-id || steps.resolve.outputs.run_id }}

runs:
  using: "composite"
  steps:
    - name: Validate run source
      if: inputs.run-id == '' && inputs.workflow-id == ''
      shell: bash
      run: |
        echo "::error::Provide either run-id or workflow-id."
        exit 1

    - name: Resolve latest successful artifact run
      if: inputs.run-id == ''
      id: resolve
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
      env:
        WORKFLOW_ID: ${{ inputs.workflow-id }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        BRANCH: ${{ inputs.branch }}
      with:
        github-token: ${{ github.token }}
        script: |
          const { WORKFLOW_ID: workflowId, ARTIFACT_NAME: artifactName, BRANCH: branch } = process.env;
          const { owner, repo } = context.repo;
          let selectedRun;

          for (let attempt = 1; attempt <= 10 && !selectedRun; attempt++) {
            const resp = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowId,
              branch,
              status: 'completed',
              per_page: 100,
              page: 1,
            });

            const successfulRuns = (resp.data.workflow_runs || [])
              .filter(run => run.conclusion === 'success')
              .sort((a, b) => b.run_number - a.run_number);

            for (const run of successfulRuns) {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                { owner, repo, run_id: run.id, per_page: 100 }
              );
              const artifact = artifacts.find(
                candidate => candidate.name === artifactName && !candidate.expired
              );
              if (artifact) {
                selectedRun = run;
                break;
              }
            }

            if (!selectedRun && attempt < 10) {
              core.info(`No successful ${workflowId} run on ${branch} contains artifact "${artifactName}"; retrying (attempt ${attempt}).`);
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
          }

          if (!selectedRun) {
            core.setFailed(`No successful ${workflowId} run on ${branch} contains artifact "${artifactName}".`);
            return;
          }

          core.info(`Using run id: ${selectedRun.id}, run_number: ${selectedRun.run_number}, branch: ${selectedRun.head_branch}`);
          core.setOutput('run_id', String(selectedRun.id));

    - name: Download artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
      with:
        name: ${{ inputs.artifact-name }}
        github-token: ${{ github.token }}
        run-id: ${{ inputs.run-id || steps.resolve.outputs.run_id }}
        path: ${{ inputs.path }}

    - name: Extract archive
      if: inputs.extract-archive == 'true'
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        ARCHIVE_FILE: ${{ inputs.archive-file }}
        DOWNLOAD_PATH: ${{ inputs.path }}
        EXTRACT_TO: ${{ inputs.extract-to }}
        STRIP_COMPONENTS: ${{ inputs.strip-components }}
      run: |
        set -euo pipefail
        mkdir -p "$EXTRACT_TO"
        archive_file="${ARCHIVE_FILE:-$ARTIFACT_NAME}"
        tar -xvf "${DOWNLOAD_PATH}/${archive_file}" \
          -C "$EXTRACT_TO" --strip-components="$STRIP_COMPONENTS"
        ls "$EXTRACT_TO"

    - name: Add extracted directory to PATH
      if: inputs.extract-archive == 'true' && inputs.add-to-path != ''
      shell: bash
      env:
        PATH_TO_ADD: ${{ inputs.add-to-path }}
      run: |
        set -euo pipefail
        if [[ "$PATH_TO_ADD" != /* ]]; then
          PATH_TO_ADD="${GITHUB_WORKSPACE}/${PATH_TO_ADD}"
        fi
        echo "$PATH_TO_ADD" >> "$GITHUB_PATH"
