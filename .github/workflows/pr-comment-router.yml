name: PR comment router
run-name: "PR comment router #${{ inputs.pr_number || github.event.issue.number }}"

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: number
      pr_sha:
        description: "Exact pull request head SHA"
        required: true
        type: string
      command:
        description: "Space-separated test workflows to run"
        required: true
        type: string
      request_id:
        description: "Optional request ID used to correlate an external workflow dispatch"
        required: false
        default: "manual"
        type: string

concurrency:
  # Keep the group short: comment bodies are user-controlled and may exceed GitHub's 400-character limit.
  group: pr-comment-router-${{ inputs.pr_number || github.event.issue.number }}-${{ github.event.comment.id || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'qualcomm/eld' && (github.event_name == 'workflow_dispatch' || github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write # Read PR details and post the accepted-request comment.
      statuses: write
    outputs:
      pr_number: ${{ steps.request.outputs.pr_number }}
      pr_sha: ${{ steps.request.outputs.pr_sha }}
      request_id: ${{ steps.request.outputs.request_id }}
      artifact_name: ${{ steps.request.outputs.artifact_name }}
      artifact_run_id: ${{ steps.artifact.outputs.artifact_run_id }}
      artifact_reused: ${{ steps.artifact.outputs.artifact_reused }}
      command: ${{ steps.request.outputs.command }}
      requires_toolset: ${{ steps.request.outputs.requires_toolset }}
      selected_checks: ${{ steps.request.outputs.selected_checks }}
    steps:
      - name: Validate and parse comment request
        id: request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        env:
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_PR_SHA: ${{ inputs.pr_sha }}
          INPUT_COMMAND: ${{ inputs.command }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            // Normalize a request into supported check tokens; the all-checks alias must stand alone.
            const isWorkflowDispatch = context.eventName === 'workflow_dispatch';
            const command = (isWorkflowDispatch
              ? process.env.INPUT_COMMAND
              : process.env.COMMENT_BODY.trim()).trim();
            const allowed = new Set(['COLLABORATOR', 'MEMBER', 'OWNER']);
            const supported = new Set([
              'check-llvm-test-suite',
              'check-relocation-testing',
              'check-linux-kernel',
              'check-busybox',
              'check-reviter',
              'check-zephyr',
              'check-tsan',
              'check-asan-ubsan',
              'check-windows',
              'check-macos',
              'check-msan',
              'check-all-workflows',
            ]);
            // Deduplicate tokens so a repeated command cannot create duplicate jobs or statuses.
            const requestedCommands = [...new Set(command.split(/\s+/).filter(Boolean))];
            const runAll = requestedCommands.includes('check-all-workflows');
            let reason;
            if (!requestedCommands.length) {
              reason = 'The request does not contain a check command.';
            } else if (!isWorkflowDispatch &&
                       requestedCommands.some(requestedCommand => supported.has(requestedCommand)) &&
                       !allowed.has(context.payload.comment.author_association)) {
              reason = 'Only users with <code>COLLABORATOR</code>, <code>MEMBER</code>, or <code>OWNER</code> association can request PR checks.';
            } else if (requestedCommands.some(requestedCommand => !supported.has(requestedCommand))) {
              reason = 'The request contains text that is not a supported check command. Use only check commands, separated by spaces.';
            } else if (runAll && requestedCommands.length !== 1) {
              reason = '<code>check-all-workflows</code> must be the only command in the request.';
            }
            if (reason) {
              // Ignore ordinary discussion and reject malformed requests before creating PR statuses or comments.
              core.info('Ignoring unrelated or unauthorized comment.');
              // Explain every skipped request on the run summary page, ordinary conversation included.
              // Comments are user-controlled, so only fixed strings are written.
              await core.summary
                .addHeading('PR checks skipped', 3)
                .addRaw(`${reason} The PR checks did not run.`, true)
                .write();
              return;
            }

            // Resolve the PR once; dispatch requests must still match the exact head SHA they supplied.
            const prNumber = isWorkflowDispatch
              ? Number(process.env.INPUT_PR_NUMBER)
              : context.issue.number;
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed('A valid pull request number is required.');
              return;
            }
            const pullRequest = (await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            })).data;
            if (isWorkflowDispatch && pullRequest.head.sha !== process.env.INPUT_PR_SHA) {
              core.setFailed(
                `PR #${prNumber} moved from ${process.env.INPUT_PR_SHA} to ${pullRequest.head.sha}.`
              );
              return;
            }
            const requestId = isWorkflowDispatch
              ? process.env.INPUT_REQUEST_ID
              : `${context.issue.number}-${pullRequest.head.sha}-${context.payload.comment.id}`;
            const artifactName = `pr-eld-toolset-${prNumber}-${pullRequest.head.sha}`;
            // Shared check registry: job IDs connect to jobs below; the other fields drive status and report text.
            const checkDefinitions = new Map([
              ['check-llvm-test-suite', { job: 'llvm_test', name: 'LLVM test suite', context: 'PR LLVM test suite', usesToolset: true }],
              ['check-relocation-testing', { job: 'relocation_test', name: 'Relocation testing framework', context: 'PR Relocation testing framework', usesToolset: true }],
              ['check-linux-kernel', { job: 'linux_test', name: 'Linux kernel boot', context: 'PR Linux kernel boot', usesToolset: true }],
              ['check-busybox', { job: 'busybox_test', name: 'BusyBox', context: 'PR BusyBox', usesToolset: true }],
              ['check-reviter', { job: 'reviter_test', name: 'Reverse iterators', context: 'PR Reverse iterators', usesToolset: false }],
              ['check-zephyr', { job: 'zephyr_test', name: 'Zephyr', context: 'PR Zephyr', usesToolset: true }],
              ['check-tsan', { job: 'thread_sanitizer_test', name: 'Thread sanitizer', context: 'PR Thread Sanitizer', usesToolset: false }],
              ['check-asan-ubsan', { job: 'asan_ubsan_test', name: 'Address and undefined behavior sanitizer', context: 'PR Address and Undefined Behavior Sanitizer', usesToolset: false }],
              ['check-windows', { job: 'windows_test', name: 'Windows CI', context: 'PR Windows CI', usesToolset: false }],
              ['check-macos', { job: 'macos_test', name: 'macOS CI', context: 'PR macOS CI', usesToolset: false }],
              ['check-msan', { job: 'memory_sanitizer_test', name: 'Memory with origins sanitizer', context: 'PR Memory with Origins Sanitizer', usesToolset: false }],
            ]);
            // Filter the registry to keep a stable check order, regardless of request token order.
            const requestedSet = new Set(requestedCommands);
            const selectedChecks = [...checkDefinitions]
              .filter(([checkCommand]) => runAll || requestedSet.has(checkCommand))
              .map(([, check]) => check);
            const requiresToolset = selectedChecks.some(check => check.usesToolset);
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('pr_sha', pullRequest.head.sha);
            core.setOutput('request_id', requestId);
            core.setOutput('artifact_name', artifactName);
            core.setOutput('command', runAll ? 'check-all-workflows' : requestedCommands.join(' '));
            core.setOutput('requires_toolset', String(requiresToolset));
            // Downstream steps share this JSON instead of maintaining their own check metadata.
            core.setOutput('selected_checks', JSON.stringify(selectedChecks));

      - name: Resolve reusable PR toolset artifact
        id: artifact
        if: steps.request.outputs.pr_sha != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        env:
          ARTIFACT_NAME: ${{ steps.request.outputs.artifact_name }}
          REQUIRES_TOOLSET: ${{ steps.request.outputs.requires_toolset }}
        with:
          github-token: ${{ github.token }}
          script: |
            // Direct-build checks need no artifact lookup; toolset-based checks reuse an artifact for this exact PR SHA.
            if (process.env.REQUIRES_TOOLSET !== 'true') {
              core.info('No standard toolset artifact is required for this request.');
              core.setOutput('artifact_run_id', '');
              core.setOutput('artifact_reused', 'false');
              return;
            }

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: process.env.ARTIFACT_NAME,
                per_page: 100,
              }
            );
            // Ignore artifacts that are expired or have no source run; retain the first usable match.
            let reusableArtifact;
            for (const artifact of artifacts) {
              const runId = artifact.workflow_run?.id;
              if (artifact.expired || !runId) {
                continue;
              }
              const run = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });
              reusableArtifact = artifact;
              core.info(
                `Reusing artifact ${process.env.ARTIFACT_NAME} from workflow run ${runId} ` +
                `(overall conclusion: ${run.data.conclusion || run.data.status}).`
              );
              break;
            }
            if (!reusableArtifact) {
              core.info(`No reusable artifact found for ${process.env.ARTIFACT_NAME}; the build job will run.`);
            }
            core.setOutput('artifact_run_id', reusableArtifact ? String(reusableArtifact.workflow_run.id) : '');
            core.setOutput('artifact_reused', reusableArtifact ? 'true' : 'false');

      - name: Report accepted request
        if: steps.request.outputs.pr_sha != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        env:
          COMMAND: ${{ steps.request.outputs.command }}
          SELECTED_CHECKS: ${{ steps.request.outputs.selected_checks }}
          ARTIFACT_REUSED: ${{ steps.artifact.outputs.artifact_reused }}
          PR_NUMBER: ${{ steps.request.outputs.pr_number }}
          PR_SHA: ${{ steps.request.outputs.pr_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            // Publish pending commit statuses before the selected reusable workflows begin.
            const command = process.env.COMMAND;
            const runAll = command === 'check-all-workflows';
            const selectedChecks = JSON.parse(process.env.SELECTED_CHECKS);
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const check of selectedChecks) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: process.env.PR_SHA,
                state: 'pending',
                context: check.context,
                target_url: targetUrl,
                description: check.usesToolset
                  ? process.env.ARTIFACT_REUSED === 'true'
                    ? `Reusing the PR ELD toolset for ${check.name}.`
                    : `Building the PR ELD toolset for ${check.name}.`
                  : `Building the PR source with ${check.name}.`,
              });
            }
            // Acknowledge every accepted request, whether it came from a PR comment or workflow dispatch.
            const checkLabel = runAll
              ? 'All checks'
              : selectedChecks.map(check => check.name).join(', ');
            const artifactMessage = process.env.ARTIFACT_REUSED === 'true'
              ? ' Reusing the existing PR toolset artifact and starting the jobs.'
              : ' The checks are starting in this workflow run.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `${checkLabel} request accepted for \`${process.env.PR_SHA}\`.${artifactMessage}`,
            });

  build:
    needs: validate
    if: |
      needs.validate.outputs.pr_sha != '' &&
      needs.validate.outputs.requires_toolset == 'true' &&
      needs.validate.outputs.artifact_reused != 'true'
    uses: ./.github/workflows/ubuntu.yml
    with:
      pr_number: ${{ needs.validate.outputs.pr_number }}
      pr_sha: ${{ needs.validate.outputs.pr_sha }}
      request_id: ${{ needs.validate.outputs.request_id }}
      check_name: ${{ needs.validate.outputs.command }}
      skip_tests: true
    permissions:
      contents: write
      actions: write
      pull-requests: read
      statuses: write

  llvm_test:
    needs: [validate, build]
    if: |
      always() &&
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.validate.outputs.pr_sha != '' &&
      (contains(needs.validate.outputs.command, 'check-llvm-test-suite') ||
       needs.validate.outputs.command == 'check-all-workflows') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    uses: ./.github/workflows/llvm-test-suite.yml
    with:
      pr_number: ${{ needs.validate.outputs.pr_number }}
      pr_sha: ${{ needs.validate.outputs.pr_sha }}
      toolset_run_id: ${{ needs.build.outputs.artifact_run_id || needs.validate.outputs.artifact_run_id }}
      toolset_artifact: ${{ needs.build.outputs.artifact_name || needs.validate.outputs.artifact_name }}
      toolset_tarball: install-pr-toolset.tar.xz
    permissions:
      contents: write
      actions: write

  relocation_test:
    needs: [validate, build]
    if: |
      always() &&
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.validate.outputs.pr_sha != '' &&
      (contains(needs.validate.outputs.command, 'check-relocation-testing') ||
       needs.validate.outputs.command == 'check-all-workflows') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    uses: ./.github/workflows/relocation-testing.yml
    with:
      pr_number: ${{ needs.validate.outputs.pr_number }}
      pr_sha: ${{ needs.validate.outputs.pr_sha }}
      toolset_run_id: ${{ needs.build.outputs.artifact_run_id || needs.validate.outputs.artifact_run_id }}
      toolset_artifact: ${{ needs.build.outputs.artifact_name || needs.validate.outputs.artifact_name }}
    permissions:
      actions: write
      contents: write

  linux_test:
    needs: [validate, build]
    if: |
      always() &&
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.validate.outputs.pr_sha != '' &&
      (contains(needs.validate.outputs.command, 'check-linux-kernel') ||
       needs.validate.outputs.command == 'check-all-workflows') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    uses: ./.github/workflows/linux-kernel.yml
    with:
      pr_number: ${{ needs.validate.outputs.pr_number }}
      pr_sha: ${{ needs.validate.outputs.pr_sha }}
      toolset_run_id: ${{ needs.build.outputs.artifact_run_id || needs.validate.outputs.artifact_run_id }}
      toolset_artifact: ${{ needs.build.outputs.artifact_name || needs.validate.outputs.artifact_name }}
      toolset_tarball: install-pr-toolset.tar.xz
    permissions:
      contents: write
      actions: write

  busybox_test:
    needs: [validate, build]
    if: |
      always() &&
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.validate.outputs.pr_sha != '' &&
      (contains(needs.validate.outputs.command, 'check-busybox') ||
       needs.validate.outputs.command == 'check-all-workflows') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    uses: ./.github/workflows/busybox.yml
    with:
      pr_number: ${{ needs.validate.outputs.pr_number }}
      pr_sha: ${{ needs.validate.outputs.pr_sha }}
      toolset_run_id: ${{ needs.build.outputs.artifact_run_id || needs.validate.outputs.artifact_run_id }}
      toolset_artifact: ${{ needs.build.outputs.artifact_name || needs.validate.outputs.artifact_name }}
      toolset_tarball: install-pr-toolset.tar.xz
    permissions:
      contents: write
      actions: write

  zephyr_test:
    needs: [validate, build]
    if: |
      always() &&
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.validate.outputs.pr_sha != '' &&
      (contains(needs.validate.outputs.command, 'check-zephyr') ||
       needs.validate.outputs.command == 'check-all-workflows') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    uses: ./.github/workflows/zephyr.yml
    with:
      pr_number: ${{ needs.validate.outputs.pr_number }}
      pr_sha: ${{ needs.validate.outputs.pr_sha }}
      toolset_run_id: ${{ needs.build.outputs.artifact_run_id || needs.validate.outputs.artifact_run_id }}
      toolset_artifact: ${{ needs.build.outputs.artifact_name || needs.validate.outputs.artifact_name }}
      toolset_tarball: install-pr-toolset.tar.xz
    permissions:
      contents: write
      actions: write

  thread_sanitizer_test:
    needs: validate
    if: |
      always() &&
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.validate.outputs.pr_sha != '' &&
      (contains(needs.validate.outputs.command, 'check-tsan') ||
       needs.validate.outputs.command == 'check-all-workflows')
    uses: ./.github/workflows/sanitize-threads.yml
    with:
      pr_number: ${{ needs.validate.outputs.pr_number }}
      pr_sha: ${{ needs.validate.outputs.pr_sha }}
    permissions:
      contents: write
      actions: write

  asan_ubsan_test:
    needs: validate
    if: |
      always() &&
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.validate.outputs.pr_sha != '' &&
      (contains(needs.validate.outputs.command, 'check-asan-ubsan') ||
       needs.validate.outputs.command == 'check-all-workflows')
    uses: ./.github/workflows/sanitize-address-undefined.yml
    with:
      pr_number: ${{ needs.validate.outputs.pr_number }}
      pr_sha: ${{ needs.validate.outputs.pr_sha }}
    permissions:
      contents: write
      actions: write

  windows_test:
    needs: validate
    if: |
      always() &&
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.validate.outputs.pr_sha != '' &&
      (contains(needs.validate.outputs.command, 'check-windows') ||
       needs.validate.outputs.command == 'check-all-workflows')
    uses: ./.github/workflows/windows.yml
    with:
      pr_number: ${{ needs.validate.outputs.pr_number }}
      pr_sha: ${{ needs.validate.outputs.pr_sha }}
      run_visual_studio: false
    permissions:
      actions: write
      contents: write

  macos_test:
    needs: validate
    if: |
      always() &&
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.validate.outputs.pr_sha != '' &&
      (contains(needs.validate.outputs.command, 'check-macos') ||
       needs.validate.outputs.command == 'check-all-workflows')
    uses: ./.github/workflows/macos.yml
    with:
      pr_number: ${{ needs.validate.outputs.pr_number }}
      pr_sha: ${{ needs.validate.outputs.pr_sha }}
    permissions:
      contents: write
      actions: write

  memory_sanitizer_test:
    needs: validate
    if: |
      always() &&
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.validate.outputs.pr_sha != '' &&
      (contains(needs.validate.outputs.command, 'check-msan') ||
       needs.validate.outputs.command == 'check-all-workflows')
    uses: ./.github/workflows/sanitize-memory.yml
    with:
      pr_number: ${{ needs.validate.outputs.pr_number }}
      pr_sha: ${{ needs.validate.outputs.pr_sha }}
    permissions:
      contents: write
      actions: write

  reviter_test:
    needs: validate
    if: |
      always() &&
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.validate.outputs.pr_sha != '' &&
      (contains(needs.validate.outputs.command, 'check-reviter') ||
       needs.validate.outputs.command == 'check-all-workflows')
    uses: ./.github/workflows/reviter.yml
    with:
      pr_number: ${{ needs.validate.outputs.pr_number }}
      pr_sha: ${{ needs.validate.outputs.pr_sha }}
    permissions:
      actions: write
      contents: write

  report_checks:
    # Keep these direct dependencies in sync with the job IDs in validate's check definitions.
    needs: [validate, build, llvm_test, relocation_test, linux_test, busybox_test, reviter_test, zephyr_test, thread_sanitizer_test, asan_ubsan_test, memory_sanitizer_test, windows_test, macos_test]
    if: |
      always() &&
      !cancelled() &&
      needs.validate.outputs.pr_sha != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Post the consolidated results comment.
      statuses: write
    steps:
      - name: Report PR check results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        env:
          COMMAND: ${{ needs.validate.outputs.command }}
          SELECTED_CHECKS: ${{ needs.validate.outputs.selected_checks }}
          PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
          PR_SHA: ${{ needs.validate.outputs.pr_sha }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            // Combine the selected check metadata with results from this job's direct dependencies.
            const jobResults = JSON.parse(process.env.JOB_RESULTS);
            const selectedChecks = JSON.parse(process.env.SELECTED_CHECKS)
              .map(check => ({
                ...check,
                buildResult: check.usesToolset ? jobResults.build.result : 'skipped',
                testResult: jobResults[check.job]?.result ?? 'skipped',
              }));
            if (!selectedChecks.length) {
              core.setFailed(`No reportable PR checks found for command "${process.env.COMMAND}".`);
              return;
            }

            const results = [];
            const reportingErrors = [];
            for (const check of selectedChecks) {
              // A toolset failure fails every dependent check; otherwise the test job itself must succeed.
              const buildFailed = ['failure', 'cancelled'].includes(check.buildResult);
              const buildSucceeded = ['success', 'skipped'].includes(check.buildResult);
              const passed = buildSucceeded && check.testResult === 'success';
              const state = passed ? 'success' : 'failure';
              const message = buildFailed
                ? `❌ PR ELD toolset build ${check.buildResult} for ${check.name} for \`${process.env.PR_SHA}\`.`
                : passed
                  ? `✅ ${check.name} passed for \`${process.env.PR_SHA}\`.`
                  : `❌ ${check.name} failed for \`${process.env.PR_SHA}\`.`;
              const detail = buildFailed
                ? `${check.name}: toolset build ${check.buildResult}; test ${check.testResult}`
                : `${check.name}: ${check.testResult}`;
              results.push({ passed, detail });
              try {
                // Update each check's own commit status while continuing if one status API call fails.
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha: process.env.PR_SHA,
                  state,
                  context: check.context,
                  target_url: process.env.RUN_URL,
                  description: message,
                });
              } catch (error) {
                core.error(`Could not report ${check.name}: ${error.message}`);
                reportingErrors.push(check.name);
              }
            }

            // Post all selected results together so each request produces one report comment.
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `${results.map(result => `${result.passed ? '✅' : '❌'} ${result.detail}`).join('\n')}\n\n[View workflow run](${process.env.RUN_URL}).`,
            });
            if (reportingErrors.length) {
              core.setFailed(`Failed to report check statuses: ${reportingErrors.join(', ')}.`);
            }

  # Delete uploaded test outputs here so the PR code jobs can keep read-only tokens.
  cleanup_pr_artifacts:
    needs:
      - validate
      - build
      - llvm_test
      - linux_test
      - busybox_test
      - zephyr_test
      - thread_sanitizer_test
      - asan_ubsan_test
      - windows_test
      - macos_test
      - memory_sanitizer_test
      - reviter_test
      - report_checks
    if: always() && needs.validate.outputs.pr_sha != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout artifact cleanup action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          path: eld-workflows
          persist-credentials: false

      - name: Delete older PR artifacts
        continue-on-error: true
        uses: ./eld-workflows/.github/workflows/DeleteOldArtifacts
