# -*- Python -*-

"""Standalone lit configuration for the ELD plugin test suites.

This configuration intentionally does not load eld/test/lit.cfg. It only
depends on lit, the external LLVM tools package, the installed ELD tools, and
the target tools passed by the standalone CMake project. The in-tree ELD test
suite has a richer configuration in test/lit.cfg; plugin tests should only
use substitutions defined here when they need to run in both modes.
"""

import os
from pathlib import Path
import platform
import shlex
import shutil

import lit.formats


def required_param(name):
    value = lit_config.params.get(name, "")
    if not value:
        lit_config.fatal("missing plugin test parameter %r" % name)
    return value


def shell_command(executable, flags="", target_triple=""):
    parts = [executable] if executable else []
    if target_triple:
        parts.append("--target=" + target_triple)
    if flags:
        parts.extend(shlex.split(flags))
    return " ".join(shlex.quote(part) for part in parts)


def tool(name, tools_dir):
    candidate = shutil.which(name, path=os.fspath(tools_dir))
    if candidate:
        return shlex.quote(candidate)
    return name


config.name = "eld-plugins"
config.maxIndividualTestTime = 120
# Use lit's internal shell; external execution is deprecated in LLVM 23 and
# is rejected by newer lit versions.
config.test_format = lit.formats.ShTest(execute_external=False)
config.suffixes = [".test", ".s", ".ll", ".sh"]
config.excludes = ["Inputs"]

plugin_root = Path(__file__).resolve().parent
eld_obj_root = Path(required_param("eld_obj_root")).resolve()
llvm_tools_dir = Path(required_param("llvm_tools_dir")).resolve()
llvm_libs_dir = Path(required_param("llvm_libs_dir")).resolve()
eld_tools_value = lit_config.params.get("eld_tools_dir", "")
plugin_library_value = lit_config.params.get("plugin_library_dir", "")
eld_tools_dir = Path(eld_tools_value).resolve() if eld_tools_value else None
plugin_library_dir = (Path(plugin_library_value).resolve()
                      if plugin_library_value else None)

config.test_source_root = os.fspath(plugin_root)

test_target = lit_config.params.get("eld_test_target", "")
target_triple = lit_config.params.get("target_triple", "").lower()


def derive_test_target(triple):
    arch = triple.split("-", 1)[0].split(".", 1)[0]
    if arch == "hexagon":
        return "Hexagon"
    if arch in ("riscv64", "rv64"):
        return "RISCV64"
    if arch in ("riscv32", "rv32"):
        return "RISCV"
    if arch in ("aarch64", "arm64"):
        return "AArch64"
    if arch.startswith(("arm", "thumb")):
        return "ARM"
    if arch in ("x86_64", "amd64") or arch.startswith(
            ("i386", "i486", "i586", "i686")):
        return "X86"
    return ""


if not test_target:
    test_target = derive_test_target(target_triple)
if not test_target:
    lit_config.fatal(
        "missing lit target: provide 'eld_test_target' or a recognizable "
        "'target_triple'")

test_target = test_target.split("_", 1)[0]
default_triples = {
    "Hexagon": "hexagon-unknown-none-elf",
    "RISCV64": "riscv64-unknown-none-elf",
    "RISCV": "riscv32-unknown-none-elf",
    "AArch64": "aarch64-unknown-none-elf",
    "ARM": "arm-unknown-none-eabi",
    "X86": "x86_64-unknown-linux-gnu",
}
if not target_triple:
    target_triple = default_triples.get(test_target, "")

config.target_triple = target_triple
config.test_target = test_target
config.eld_targets_to_build = test_target + "_default"
config.targets_to_build = config.eld_targets_to_build
config.test_exec_root = os.fspath(
    eld_obj_root / "test" / config.eld_targets_to_build / "Plugins")

if test_target in ("RISCV64", "AArch64", "X86"):
    config.available_features.add("64BitsArch")
else:
    config.available_features.add("32BitsArch")
config.available_features.add("shell")
config.available_features.add(test_target.lower())
if platform.system() == "Linux":
    config.available_features.add("linux")
if platform.system() == "Windows":
    config.available_features.add("windows")
if lit_config.params.get("has_zlib", "") == "1":
    config.available_features.add("zlib")

config.environment["PYTHON_EXECUTABLE"] = lit_config.params.get(
    "python_executable", "python")

path_entries = [os.fspath(llvm_tools_dir)]
if eld_tools_dir:
    path_entries.append(os.fspath(eld_tools_dir / "bin"))
for compiler_param in ("target_cc", "target_cxx", "target_ld"):
    compiler = lit_config.params.get(compiler_param, "")
    if compiler:
        path_entries.append(os.fspath(Path(compiler).resolve().parent))
path_entries.append(config.environment.get("PATH", ""))
config.environment["PATH"] = os.pathsep.join(
    entry for entry in path_entries if entry)

library_entries = []
eld_library_value = lit_config.params.get("eld_library_dir", "")
eld_runtime_value = lit_config.params.get("eld_runtime_dir", "")
for library_dir in (plugin_library_dir,
                    eld_library_value or (
                        eld_tools_dir / "lib" if eld_tools_dir else None),
                    eld_runtime_value or (
                        eld_tools_dir / "bin" if eld_tools_dir else None),
                    llvm_libs_dir):
    if library_dir:
        library_entries.append(os.fspath(library_dir))
runtime_path_var = ("PATH" if os.name == "nt" else
                    "DYLD_LIBRARY_PATH" if platform.system() == "Darwin" else
                    "LD_LIBRARY_PATH")
existing_library_path = config.environment.get(runtime_path_var, "")
if existing_library_path:
    library_entries.append(existing_library_path)
if library_entries:
    config.environment[runtime_path_var] = os.pathsep.join(library_entries)

# Not every plugin suite needs readelf. Tests that do should declare
# REQUIRES: llvm-readelf instead of making it a global prerequisite.
if shutil.which("llvm-readelf", path=config.environment["PATH"]):
    config.available_features.add("llvm-readelf")

target_cc = lit_config.params.get("target_cc", "")
target_cxx = lit_config.params.get("target_cxx", "")
target_ld = lit_config.params.get("target_ld", "")
target_cc = target_cc or target_cxx or "clang"
target_cxx = target_cxx or "clang++"
target_ld = target_ld or "ld.eld"
target_cxx_flags = lit_config.params.get("target_cxx_flags", "")
target_ld_flags = lit_config.params.get("target_ld_flags", "")
compiler_opts = shell_command("", target_cxx_flags, target_triple)
default_link_options = {
    "Hexagon": "--thread-count 4 --emit-relocs",
    "X86": "--thread-count 4 --emit-relocs",
    "ARM": "--thread-count 4 --threads",
    "AArch64": "--thread-count 4 --threads",
    "RISCV64": "--thread-count 4 --emit-relocs --image-base 0",
    "RISCV": "--thread-count 4 --emit-relocs --image-base 0",
}.get(test_target, "")
link_options = " ".join(
    option for option in (default_link_options, target_ld_flags) if option)

# These are the substitutions used by the plugin-local tests. The target
# compiler and linker are explicit paths supplied by CMake; the remaining
# tools are resolved from the external LLVM tools directory/PATH.
config.substitutions.extend([
    ("%clangopts", compiler_opts),
    ("%clangxxopts", compiler_opts),
    ("%linkopts", link_options),
    ("%clangxx", shlex.quote(target_cxx)),
    ("%clang", shlex.quote(target_cc)),
    ("%link", shlex.quote(target_ld)),
    ("%filecheck", tool("FileCheck", llvm_tools_dir)),
    ("%readelf", tool("llvm-readelf", llvm_tools_dir)),
    ("%python", shlex.quote(config.environment["PYTHON_EXECUTABLE"])),
    ("%not", tool("not", llvm_tools_dir)),
])

lit_config.note("Configuring standalone ELD plugin tests for {}".format(
    config.eld_targets_to_build))
