# -*- Python -*-

# Shared lit configuration for plugin-local tests. The main ELD test suite
# passes these values as lit parameters so this file can be reused by every
# plugin without duplicating target-specific site configuration.

import os
from pathlib import Path

required_params = [
    "eld_src_root",
    "eld_obj_root",
    "llvm_src_root",
    "llvm_obj_root",
    "llvm_tools_dir",
    "llvm_libs_dir",
    "eld_targets_to_build",
]
for name in required_params:
    value = lit_config.params.get(name)
    if value is None:
        lit_config.fatal("missing plugin test parameter %r" % name)
    setattr(config, name, value)

optional_params = [
    "target_triple",
    "python_executable",
    "emulator",
    "emulator64",
    "eld_option",
    "eld_option_name",
    "has_sanitize",
    "has_tsan",
    "has_symbol_versioning",
    "cpp_compiler",
    "cmake_executable",
    "enable_run_tests",
    "has_zlib",
]
for name in optional_params:
    setattr(config, name, lit_config.params.get(name, ""))
config.targets_to_build = config.eld_targets_to_build

# Reuse all standard ELD substitutions, features, and test format setup.
import lit.llvm
lit.llvm.initialize(lit_config, config)
lit_config.load_config(config, os.path.join(config.eld_src_root, "test", "lit.cfg"))

# The common configuration points at eld/test. Restore the plugin-local roots
# after loading it so %p and test execution directories are plugin-relative.
config.test_source_root = os.fspath(Path(config.eld_src_root) / "Plugins")
config.test_exec_root = os.fspath(
    Path(config.eld_obj_root) / "test" / config.eld_targets_to_build / "Plugins"
)
